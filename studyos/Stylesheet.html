/* ==========================================================
   ESTILOS: BOTÃO SPLIT LOUSA (INTEGRAÇÃO NATIVA)
========================================================== */
/* Sobrescreve o .pd-pill padrão apenas para este componente */
#pd-canvas {
  display: inline-flex !important;
  align-items: center;
  width: auto !important; /* Ignora os 82px fixos */
  padding: 0 !important;
  margin-left: 4px;
  overflow: visible !important;
  opacity: 0.6; /* Estado opaco nativo */
  transition: all 0.3s;
}
#pd-canvas:hover { opacity: 0.85; }

/* Estado ACESO (Lousa Pronta) gerenciado pelo _pdSet() */
#pd-canvas.loaded {
  opacity: 1 !important;
  border-color: var(--accent) !important;
  color: var(--accent) !important;
  background: var(--surface) !important;
}

.split-btn-main {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 100%;
  padding: 0 8px 0 11px;
  background: transparent;
  border: none;
  color: inherit;
  font-family: 'Nunito Sans', sans-serif;
  font-size: var(--cv-fs-caption);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  cursor: pointer;
  outline: none;
}
.split-btn-divider {
  width: 1px;
  height: 16px;
  background: currentColor;
  opacity: 0.25;
}
.split-btn-trigger {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  width: 26px;
  background: transparent;
  border: none;
  color: inherit;
  cursor: pointer;
  outline: none;
  border-radius: 0 8px 8px 0;
}

.split-btn-main svg { width: 16px; height: 16px; flex-shrink: 0; }
.split-btn-trigger svg { width: 14px; height: 14px; flex-shrink: 0; }

/* Menu Dropdown - Fixado na tela para não cortar no overflow da navbar */
.split-dropdown-menu {
  position: fixed;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow-lg);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  min-width: 140px;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-10px);
  transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
}
.split-dropdown-menu.active {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}
.split-menu-item {
  padding: 12px 16px;
  font-family: 'Nunito Sans', sans-serif;
  font-size: var(--cv-fs-caption);
  font-weight: 700;
  color: var(--text-2);
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border-light);
  text-align: left;
}
.split-menu-item:last-child { border-bottom: none; }
.split-menu-item:hover { background: var(--surface-hover); color: var(--accent); }

/* --- INÍCIO: ESTILOS PARA LOUSA SALVA E DROP-DOWN DE AÇÃO --- */

/* Estilos para o botão principal quando há Lousa Salva no BD (VERDE) */
#pd-canvas.has-saved {
  border-color: var(--green) !important;
  color: var(--green) !important;
  background: var(--green-bg) !important;
  opacity: 1 !important;
  box-shadow: inset 0 0 0 1px var(--green), 0 0 12px rgba(45, 106, 79, 0.3) !important;
  animation: pulse-saved-canvas 2s infinite;
}

#pd-canvas.has-saved .split-btn-main, 
#pd-canvas.has-saved .split-btn-trigger {
  color: var(--green) !important;
}

@keyframes pulse-saved-canvas {
  0%, 100% { box-shadow: inset 0 0 0 1px var(--green), 0 0 0 0 rgba(45, 106, 79, 0.5); }
  50%      { box-shadow: inset 0 0 0 1px var(--green), 0 0 0 8px rgba(45, 106, 79, 0); }
}

/* Divisórias do Dropdown Limpas */
.split-menu-section {
  font-size: var(--cv-fs-micro);
  font-weight: 800;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 8px 16px 4px;
  background: var(--bg);
  border-bottom: 1px solid var(--border-light);
}

/* Padronização dos Ícones SVG no Dropdown */
.split-menu-item svg {
  width: 14px;
  height: 14px;
  margin-right: 6px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.5;
  vertical-align: middle;
}

/* Estado APAGADO (CINZA) para Lousa/Mapa (Se não existir no Drive) */
.split-menu-item.saved-item {
  color: var(--text-3);
  opacity: 0.5;
  pointer-events: none; /* Impede o clique */
}

/* Estado ACESO (VERDE) para Lousa/Mapa (Se existir no Drive) */
.split-menu-item.saved-item.item-disponivel {
  color: var(--green) !important;
  background: var(--bg) !important;
  opacity: 1;
  pointer-events: auto !important; 
  font-weight: 800;
}

.split-menu-item.saved-item.item-disponivel:hover {
  background: var(--green-bg) !important;
}

/* Estado de Ação para Gerar Novos (VERMELHO) */
.split-menu-item.action-new {
  color: var(--red);
  font-weight: 700;
}

.split-menu-item.action-new:hover {
  background: var(--red-bg);
}

/* --- FIM: ESTILOS PARA LOUSA SALVA E DROP-DOWN DE AÇÃO --- */






/* Esconde texto no modo de ícones */
.navbar-icons-only .split-btn-main > span { display: none; }
.navbar-icons-only .split-btn-main { padding: 0; width: 32px; justify-content: center; }







.layout-caso-completo {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto 1fr;
  gap: 14px;
}
.caso-contexto {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.caso-enunciado {
  background: #f0f9ff;
  border: 1.5px solid #bae6fd;
  border-radius: 12px;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.caso-enunciado-ttl {
  font-size: var(--cv-fs-micro);
  font-weight: 800;
  color: #0369a1;
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 4px;
}
.caso-ref {
  background: #f0fdf4;
  border: 1.5px solid #bbf7d0;
  border-radius: 12px;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.caso-ref-ttl {
  font-size: var(--cv-fs-micro);
  font-weight: 800;
  color: #166534;
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 4px;
}
.caso-ref-fml {
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  font-size: var(--cv-fs-body);
  font-weight: 800;

  background: #f0fdf4;
  border: 1px solid #86efac;
  border-left: 4px solid #059669;
  border-radius: 8px;
  padding: 12px 16px;
  margin: 6px 0;
  white-space: normal;
  line-height: 1.7;
  box-shadow: 0 2px 6px rgba(5,150,105,0.10);
}

  font-size: var(--cv-fs-micro);
  font-weight: 800;

  display: flex;

  justify-content: center;

  font-size: clamp(var(--cv-fs-body), 1.8vh, var(--cv-fs-title));

.canvas-bloco-wrap .exec-table {
  width: 100%; border-collapse: collapse; border-radius: 12px; overflow: hidden;

.canvas-bloco-wrap .exec-table th,

  background: #071020; color: #fff;

.canvas-bloco-wrap .exec-table tr:last-child td { border-bottom: none; }
.canvas-bloco-wrap .exec-table tr:nth-child(even) td { background: #f7f9fc; }
.canvas-bloco-wrap .exec-table td:first-child { font-weight: 700; color: #0c1526; }

  .canvas-bloco-wrap .exec-case-top    { grid-template-columns: 1fr; }

========================================================================= */






/* =========================================================================
   JANELA DO CANVAS (DIMENSÕES RÍGIDAS CONTROLADAS PELO JS)
========================================================================= */
#canvas-ia-painel {
    /* O width e height agora são injetados diretamente pelo JS (1627px ou 2509px) */
    background: var(--surface) !important;
    border: 1px solid var(--border) !important;
    border-radius: 16px !important;
    box-shadow: 0 24px 64px rgba(0,0,0,0.3) !important;
    
    overflow: hidden !important; /* CORREÇÃO AQUI: Corta as pontas quadradas do cabeçalho */
    
    display: flex !important;
    flex-direction: column !important;
    margin: 0 !important;
    box-sizing: border-box;
    position: relative;
    
    /* Importante para a animação de escala funcionar a partir do centro sem quebrar a janela */
    transform-origin: center center;
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), width 0.3s ease, height 0.3s ease;
}

/* =========================================================================
   O QUADRO BRANCO INTERNO (SLIDE FUNDIDO COM O PAINEL)
========================================================================= */



/* Limita forçadamente os filhos do corpo para nunca extrapolarem a largura */
.canvas-bloco-wrap .s-body > * {
    max-width: 100% !important;
    box-sizing: border-box !important;
}
/* Zera o espaço morto extra se o primeiro item for título e remove sobra da base */
.canvas-bloco-wrap .s-body > *:first-child,
.canvas-bloco-wrap .s-body > .sec-title + * {
    margin-top: 0 !important;
}

.canvas-bloco-wrap .s-body > *:last-child {
    margin-bottom: 0 !important;
}





/* O CONTEÚDO SCROLLÁVEL (Onde o conteúdo cresce) */



/* Garante que o topo fique zerado se o título for a primeira coisa */

.canvas-bloco-wrap .s-body > .sec-title + * {
    margin-top: 0 !important;
}

/* [REDE-DE-SEGURANCA-VISIVEL] Barra fina visivel em vez de invisivel — ver
   justificativa completa na definicao principal de .s-body (~linha 3858).
   Mantida como webkit-scrollbar por completude entre navegadores. */
.canvas-bloco-wrap .s-body::-webkit-scrollbar {
    display: block !important;
    width: 5px !important;
    background: transparent !important;

/* ================================================================
   ANIMAÇÕES ESPECÍFICAS PARA SVG E MATRIZES (T15)
================================================================ */
/* Efeito de desenho de linha contínuo */
.svg-draw {
  stroke-dasharray: 2000;
  stroke-dashoffset: 2000;
  animation: svgDrawAnim 1.8s ease-in-out forwards;
}

/* Efeito de salto elástico para caixas de resultado */
.pop-in {
  opacity: 0;
  transform: scale(0.82);
  animation: popInAnim 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes svgDrawAnim {
  to { stroke-dashoffset: 0; }
}

@keyframes popInAnim {
  0%   { opacity: 0; transform: scale(0.82); }
  70%  { transform: scale(1.07); }
  100% { opacity: 1; transform: scale(1); }
}

/* ══════════════════════════════════════════════════════════════════════════════
   TÓPICOS E RESUMO — TIPOGRAFIA E BLOCOS  (camada única; substitui V15.4, V92, V25,
   V32, V36 e V-ZOOM-UNICO, que disputavam as mesmas propriedades com !important)

   Regras do sistema
   1. Um único fator de zoom: o corpo vale  base × --zoom-secao.  Todo o resto é
      em "em" (títulos, espaços, caixas), então A+ / A− escalam tudo junto, sem
      lista de seletores e sem depender de onde a variável foi declarada.
      O título do tópico fica FORA de #wiz-content, por isso usa o mesmo cálculo
      direto (antes ele lia --z-h1, que só existia dentro de #wiz-content: a
      declaração ficava inválida e o título herdava ~15px e não acompanhava o zoom).
   2. Hierarquia por tamanho, peso e espaço. Sem faixa lateral, sem cor por tipo de
      bloco: a identidade do bloco é o rótulo (CONCEITO, ATENÇÃO, EXEMPLO...).
   3. Espaço entre blocos vem do IRMÃO SEGUINTE (> * + *), nunca de margem inferior
      de cada elemento: não soma, não colapsa e funciona com qualquer conteúdo.
   4. Nada estoura: palavra longa quebra, tabela rola dentro do próprio invólucro,
      imagem/pré/fórmula ficam dentro da largura.
   5. Sem !important, exceto onde a regra concorrente já é !important. São três, todas
      escopadas a #wiz-content / #conteudo-body e comentadas no ponto de uso:
        · .katex / .katex-display  (regras globais: moldura tracejada azul e 1.45em)
        · table td, table th       (regra global: vertical-align:middle)
        · text-align das células   (style="" inline gravado por _v25EnvolverTabelas)
   ══════════════════════════════════════════════════════════════════════════════ */

:root{
  --tx-ink:#0f172a;  --tx-ink-2:#334155;  --tx-ink-3:#64748b;
  --tx-line:#e2e8f0; --tx-line-2:#cbd5e1;
  --tx-surface:#f8fafc; --tx-paper:#ffffff;
  --tx-radius:12px;
  --tx-sans:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --tx-serif:"Lora", Georgia, "Times New Roman", serif;
  --tx-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --tx-base:17px;                                   /* corpo de texto, zoom 100% */
  --tx-title:clamp(28px, 1.2vw + 20px, 40px);       /* título do tópico          */
}
@media (max-width:640px){
  :root{ --tx-base:16px; --tx-title:26px; }
}

/* ── título do tópico (renderizado pelo app, fora do innerHTML) ─────────────── */
#wiz-topic-title{
  font-family:var(--tx-sans);
  font-weight:800;
  font-size:calc(var(--tx-title) * var(--zoom-secao, 1));
  line-height:1.18;
  letter-spacing:-.024em;
  color:var(--tx-ink);
  margin:0 auto .7em;
  padding:0 40px;
  max-width:100%;
  text-wrap:balance;
  overflow-wrap:break-word;
}
@media (max-width:640px){
  #wiz-topic-title{ padding:0 18px; }
}

/* ── contêineres ───────────────────────────────────────────────────────────── */
:is(#wiz-content, #conteudo-body.tp-corpo){
  font-family:var(--tx-sans);
  font-size:calc(var(--tx-base) * var(--zoom-secao, 1));
  line-height:1.7;
  color:var(--tx-ink-2);
  background:var(--tx-paper);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  hyphens:manual; -webkit-hyphens:manual;
  overflow-wrap:break-word;
}
:is(#wiz-content, #conteudo-body.tp-corpo) *,
:is(#wiz-content, #conteudo-body.tp-corpo) *::before,
:is(#wiz-content, #conteudo-body.tp-corpo) *::after{ box-sizing:border-box; }

/* margem lateral alinhada ao título; folga inferior contra o rodapé fixo (V15.3) */
#wiz-content{ width:100%; max-width:100%; margin:0; padding:0 40px 96px; }
@media (max-width:640px){
  #wiz-content{ padding:20px 18px 88px; }
}

/* ── ritmo vertical ────────────────────────────────────────────────────────── */
/* zera as margens padrão do navegador; :where() não soma especificidade, então o ritmo abaixo vence */
:is(#wiz-content, #conteudo-body.tp-corpo) :where(p, ul, ol, li, dl, dd, figure, blockquote, pre, h1, h2, h3, h4, h5, h6){ margin:0; }
:is(#wiz-content, #conteudo-body.tp-corpo) > * + *{ margin-top:1.35em; }
:is(#wiz-content, #conteudo-body.tp-corpo) :is(.box, .topic__lead, .thesis, blockquote, figure, li, td, th, .tl__body, .mnemonic__list) > * + *{ margin-top:.75em; }
:is(#wiz-content, #conteudo-body.tp-corpo) .lei > * + *{ margin-top:.5em; }

/* ── texto ─────────────────────────────────────────────────────────────────── */
:is(#wiz-content, #conteudo-body.tp-corpo) p{ text-align:left; }
:is(#wiz-content, #conteudo-body.tp-corpo) :is(strong, b){ font-weight:800; color:var(--tx-ink); }
:is(#wiz-content, #conteudo-body.tp-corpo) :is(em, i){ font-style:italic; }
:is(#wiz-content, #conteudo-body.tp-corpo) a{
  color:var(--tx-ink); text-decoration:underline;
  text-decoration-color:var(--tx-line-2); text-underline-offset:.18em;
}
:is(#wiz-content, #conteudo-body.tp-corpo) mark{ background:var(--tx-line); color:inherit; padding:.05em .25em; border-radius:.25em; }
:is(#wiz-content, #conteudo-body.tp-corpo) small{ font-size:.85em; color:var(--tx-ink-3); }
:is(#wiz-content, #conteudo-body.tp-corpo) :is(sup, sub){ font-size:.72em; line-height:0; }
:is(#wiz-content, #conteudo-body.tp-corpo) abbr[title]{ text-decoration:underline dotted; cursor:help; }
:is(#wiz-content, #conteudo-body.tp-corpo) :is(code, kbd){
  font-family:var(--tx-mono); font-size:.88em;
  background:var(--tx-surface); border:1px solid var(--tx-line);
  border-radius:.35em; padding:.05em .4em; color:var(--tx-ink);
}
:is(#wiz-content, #conteudo-body.tp-corpo) pre{
  padding:1em 1.2em; overflow-x:auto; line-height:1.6;
  background:var(--tx-surface); border:1px solid var(--tx-line); border-radius:var(--tx-radius);
}
:is(#wiz-content, #conteudo-body.tp-corpo) pre code{ background:transparent; border:0; padding:0; }
:is(#wiz-content, #conteudo-body.tp-corpo) hr{ border:0; height:1px; background:var(--tx-line); margin:2em 0; }
:is(#wiz-content, #conteudo-body.tp-corpo) :is(img, video, iframe, svg){ max-width:100%; }
:is(#wiz-content, #conteudo-body.tp-corpo) :is(img, video){ height:auto; }
:is(#wiz-content, #conteudo-body.tp-corpo) figure img{ display:block; border-radius:var(--tx-radius); }
:is(#wiz-content, #conteudo-body.tp-corpo) figcaption{ font-size:.85em; color:var(--tx-ink-3); text-align:center; }

/* ── títulos ───────────────────────────────────────────────────────────────── */
:is(#wiz-content, #conteudo-body.tp-corpo) :is(h1, h2, h3, h4, h5, h6){
  font-family:var(--tx-sans); font-weight:800; color:var(--tx-ink);
  line-height:1.25; letter-spacing:-.015em; text-wrap:balance;
}
:is(#wiz-content, #conteudo-body.tp-corpo) h1{ font-size:1.9em; margin-top:2em; }
:is(#wiz-content, #conteudo-body.tp-corpo) h2{
  font-size:1.6em; margin-top:2.4em; padding-top:1em; border-top:1px solid var(--tx-line);
}
:is(#wiz-content, #conteudo-body.tp-corpo) h3{ font-size:1.3em; margin-top:1.8em; }

/* ══════════════════════════════════════════════════════════════════════
   V15.3 — FOLGA INFERIOR CONTRA O RODAPÉ FIXO (última regra do arquivo)
   O .wiz-panel é o elemento que rola (overflow-y:auto) e o .wiz-footer
   fica fixo por cima. Sem folga, o último campo some atrás dele — foi o
   que obrigou a baixar o zoom para 80%. Medido: rodapé = 69px de altura.
   Regra colocada no FIM porque tentativas anteriores, com a mesma
   especificidade, perdiam para regras posteriores do próprio arquivo.
   ══════════════════════════════════════════════════════════════════════ */

/* qualquer área rolável do app ganha a mesma folga */

#screen-wizard { --zoom-secao: var(--zoom-topicos, 1); }   /* mantém o fallback que a V15.4 garantia */





/* ══════════════════════════════════════════════════════════════════════════
   V15.5B — TEMPLATE DE CARDS E GRIDS: OTIMIZAÇÃO SIMÉTRICA
   Resolve o problema do "buraco branco" no topo.
   As grades passam a preencher harmoniosamente a tela (flex: 1), e os 
   cartões distribuem o conteúdo interno no centro para aproveitar a altura.
   A tabela no rodapé é preservada na base.
   ══════════════════════════════════════════════════════════════════════════ */

.canvas-bloco-wrap .cid-grid,
.canvas-bloco-wrap .hip-grid,
.canvas-bloco-wrap .vs-grid,
.canvas-bloco-wrap .crime-grid,
.canvas-bloco-wrap .desp-grid {
  flex: 1 1 auto !important;      /* Grade expande ocupando espaço morto */
  align-self: stretch !important; 
  align-items: stretch !important;/* Altura simétrica dos cards */
  align-content: stretch !important;
}

.canvas-bloco-wrap .cid-card,
.canvas-bloco-wrap .vs-card,
.canvas-bloco-wrap .crime-card {
  height: 100% !important;
  justify-content: center !important; /* Centraliza conteúdo dinamicamente */
  display: flex !important;
  flex-direction: column !important;
  gap: 8px !important;
}

.canvas-bloco-wrap .cid-desc,
.canvas-bloco-wrap .vs-item-txt {
  flex: 1 1 auto !important;
  display: flex;
  flex-direction: column;
  justify-content: center;        /* Texto centralizado verticalmente */
  margin-bottom: 12px !important;
}

.canvas-bloco-wrap .cid-tags {
  margin-top: auto !important;    /* Selos cravados no rodapé do card */
}

.canvas-bloco-wrap .s-body > .exec-table,
.canvas-bloco-wrap .s-body > .exec-table-wrap,
.canvas-bloco-wrap .s-body > table {
  margin-top: 24px !important;
  flex-shrink: 0 !important;      /* Tabela nunca é esmagada */
}

/* ══════════════════════════════════════════════════════════════════════
   V15.6 — SVG DO CANVAS: ALTURA NATURAL, SEM VAZIO RESERVADO

   Os templates emitem <svg viewBox='0 0 600 180' width='100%' height='100%'>.
   Com height:100% dentro de um container esticado, o SVG reserva a altura
   TODA do slide, mas o desenho (razao 600x180 = bem largo) so ocupa uma
   faixa fina — o resto vira vazio, e o diagrama fica pequeno la embaixo.
   Com height:auto o SVG passa a usar a razao do proprio viewBox: a caixa
   fica exatamente do tamanho do desenho, e o desenho cresce junto com a
   largura disponivel em vez de encolher.
   ══════════════════════════════════════════════════════════════════════ */

.canvas-bloco-wrap svg:not(.katex svg) {
  width: 100% !important;
  height: auto !important;      /* era 100%: reservava a altura toda */
  display: block;
  max-width: 100%;
}

/* ════════════════════════════════════════════════════════════════════════════

   Vai no FIM do arquivo de propósito: mesma especificidade decide por POSIÇÃO.
   Nada aqui altera regra existente — apenas sobrepõe as decisões finais.
   ════════════════════════════════════════════════════════════════════════════ */

/* ── 1. TEMA ESCURO ──────────────────────────────────────────────────────────
   Todos os 16 templates já consomem var(--...). Trocar o conjunto de tokens no
   escopo do wrapper vira o tema inteiro sem tocar em nenhuma regra de template. */
.canvas-bloco-wrap[data-tema-canvas="escuro"] {
  --bg-page:     #0B1220;
  --bg-panel:    #131C2B;
  --bg-subtle:   #1A2434;

  --text-900: #F1F5F9;
  --text-600: #CBD5E1;
  --text-400: #94A3B8;   /* 7,1:1 sobre #131C2B — passa AA com folga */

  --navy:      #E2E8F0;
  --blue-700:  #7DD3FC;
  --blue-500:  #38BDF8;
  --blue-100:  #14384F;

  --red-600:   #FCA5A5;
  --red-100:   #4A1D1D;

  --green-600: #6EE7B7;
  --green-100: #10362B;

  --amber-600: #FCD34D;

  --shadow-slide: 0 1px 3px rgba(0,0,0,.55);
}
.canvas-bloco-wrap[data-tema-canvas="escuro"] .slide { background: var(--bg-panel); }
/* Ícones e traços monocromáticos herdam a cor do texto em vez de ficarem pretos. */
.canvas-bloco-wrap[data-tema-canvas="escuro"] svg [stroke="#000"],
.canvas-bloco-wrap[data-tema-canvas="escuro"] svg [stroke="#000000"],

/* ── 2. PALCO: slide sempre centralizado no monitor ──────────────────────── */




/* ══════════════════════════════════════════════════════════════════════════
   V42 — ALTURA VERTICAL DO CORPO
   --cv-body-min-h: contraparte VERTICAL da Largura Central (--cv-body-max),
   que só controlava o eixo horizontal. Fallback "auto" = nada muda até o
   usuário mexer no slider.
   A regra dos cards de Fórmula (--cv-formula-*) fica no FIM do arquivo de
   propósito — ver BLOCO 9 — para vencer regras legadas de .mono-box e
   .eq-math-card que aparecem mais abaixo neste mesmo arquivo.
   ────────────────────────────────────────────────────────────────────────── */


/* ── 3. RESTAURAÇÃO DO FLUXO VERTICAL DO CANVAS ───────────────────────────
   A tentativa de transformar o corpo em um Grid dinâmico destruiu layouts complexos
   (T01, T12, etc). Restauramos o empilhamento vertical (Flexbox).
   Os Grids internos (.cid-grid, .vs-grid, etc.) cuidarão da distribuição horizontal. */


/* ── 4. MARGEM INTERNA MÍNIMA NOS QUATRO LADOS ─────────────────────────────── */
.canvas-bloco-wrap .card,
.canvas-bloco-wrap .a-card,
.canvas-bloco-wrap .mono-box,
.canvas-bloco-wrap .eq-math-card,
.canvas-bloco-wrap .eq-step-card,
.canvas-bloco-wrap .eq-svg-box,
.canvas-bloco-wrap .status-banner,
.canvas-bloco-wrap [class*="-card"],
.canvas-bloco-wrap [class*="-box"],
.canvas-bloco-wrap [class*="-panel"] {
  padding: 14px !important;                    /* piso p/ motores sem clamp() */
  padding: var(--cv-pad-card) !important;      /* valor proporcional real     */
  box-sizing: border-box !important;
}

/* DEFEITO CORRIGIDO: duas regras legadas zeravam `padding-top` do PRIMEIRO filho
   do corpo (`.s-body > *:first-child`, especificidade 0-3-0). O card de cima
   ficava colado na borda enquanto os outros tinham respiro — assimetria visível
   em toda lousa. Estas regras têm 0-4-0 e devolvem a margem superior. */
.canvas-bloco-wrap .s-body:not(.cv-sem-grade) > .a-card:first-child,
.canvas-bloco-wrap .s-body:not(.cv-sem-grade) > .card:first-child,
.canvas-bloco-wrap .s-body:not(.cv-sem-grade) > .mono-box:first-child,
.canvas-bloco-wrap .s-body:not(.cv-sem-grade) > [class*="-card"]:first-child,
.canvas-bloco-wrap .s-body:not(.cv-sem-grade) > [class*="-box"]:first-child,
.canvas-bloco-wrap .s-body:not(.cv-sem-grade) > [class*="-panel"]:first-child {
  padding-top: 14px !important;
  padding-top: var(--cv-pad-card) !important;
  margin-top: 0 !important;
}
/* Célula de tabela também precisa do respiro, mas menor. */
.canvas-bloco-wrap th,
.canvas-bloco-wrap td { padding: calc(var(--cv-pad-card) * 0.55) calc(var(--cv-pad-card) * 0.7) !important; }

/* ── 5. ANTI-OVERFLOW — nada extrapola o card ───────────────────────────────
   `min-width:0` é o que impede o item de grade/flex de estourar por conta do
   conteúdo intrínseco: sem ele, uma fórmula longa alarga a coluna inteira. */
/* O card único tem teto próprio (900px) definido acima; se ele entrasse nesta
   lista, o `max-width:100% !important` daqui — que vem DEPOIS no arquivo —
   anularia o teto e o card voltaria a esticar de ponta a ponta. */
.canvas-bloco-wrap .s-body > *:not(:first-child:nth-last-child(1)),
.canvas-bloco-wrap .card,
.canvas-bloco-wrap .a-card,
.canvas-bloco-wrap [class*="-card"],
.canvas-bloco-wrap [class*="-box"],
.canvas-bloco-wrap [class*="-col"],
.canvas-bloco-wrap [class*="-grid"] > * {
  min-width: 0 !important;
  max-width: 100% !important;
}
/* [FIX] min-width:0 sem piso mínimo deixava .card/.a-card/.eq-fundamental colapsarem a
   largura ~0 dentro de grids de 2 colunas (ex.: T09 "Diagonal Antissimétrica",
   coluna com .eq-fundamental + .a-card.red) — só a border-left arredondada
   ficava visível (efeito "parêntese vermelho") e o texto estourava pra fora.
   min-width garante que a coluna nunca fique menor que isso antes
   de quebrar linha/reduzir, sem interferir na altura no eixo flex. */
.canvas-bloco-wrap .s-body [style*="grid-template-columns"] > .card,

/* SVG: escala junto com o card em vez de manter largura fixa e vazar.
   [CORRIGIDO] Antes isto era `svg { width:auto!important; height:auto!important }`
   incondicional — sobrescrevia width/height NUMÉRICOS que a própria IA define
   inline em diagramas desenhados para caber numa caixa específica (ex.
   width='140' height='140'), pois presentation attribute perde para
   !important. O teto de tamanho (max-width/max-height) é seguro para
   qualquer SVG e continua incondicional; só o `width:auto/height:auto` (que
   força o SVG a assumir o tamanho intrínseco do viewBox) fica restrito aos
   SVGs "livres": sem width/height no HTML, ou com width/height percentual
   (é o padrão dos 17 esqueletos deste arquivo, que usam width='100%'
   height='100%'). Um SVG com width/height fixos em px continua do tamanho
   que a IA escolheu, apenas limitado pelo teto abaixo. */
.canvas-bloco-wrap:not([data-mapa="1"]) svg {
  max-width: 90% !important;
  max-height: var(--cv-svg-max, 60vh) !important;

.canvas-bloco-wrap:not([data-mapa="1"]) svg[height*="%"] {

}

/* As 4 caixas nomeadas saem deste fallback genérico — ver "2b" logo abaixo,

/* Tipografia EXCLUSIVA de dentro dos SVGs (Gráficos)
   FIX (checklist 2.4c): a regra antiga forçava font-size:14px !important em

/* ══════════════════════════════════════════════════════════════════════════
   V42 — CARDS DE FÓRMULA (escopo isolado, --cv-formula-*)

/* [REMOVIDO A9 — regra 100% morta, sobreposta por camada posterior; ver relatorio-auditoria-camadas-v15-v50-notcvx.md] */

/* ══════════════════════════════════════════════════════════════════════════

   V50 — CAMADA DE PERSONALIZAÇÃO DO CANVAS (append-only, fim do arquivo)

   REGRA DE OURO DESTE BLOCO: todo valor é `var(--X, <default atual>)`.
   O fallback é EXATAMENTE o valor que o arquivo já produzia antes desta
   camada. Enquanto o usuário não mexer em nada, o pixel é o mesmo.

   Fica no FIM de propósito: mesma especificidade + !important decide por
   POSIÇÃO, então estas regras vencem as legadas sem precisar inflar seletor.

   Namespaces:
     --cv-*   = hooks que JÁ existiam no arquivo (reutilizados, não duplicados)
     --cvx-*  = hooks novos criados por esta camada
   ══════════════════════════════════════════════════════════════════════════ */

/* ── 1. LÂMINA / PALCO ──────────────────────────────────────────────────── */

/* ── 2. TÍTULO DO SLIDE (vive no cabeçalho, fora do wrapper) ────────────── */

#canvas-ia-titulo-bloco {

/* ── 3. TIPOGRAFIA DE CORPO ─────────────────────────────────────────────── */

/* ── 3b. TÍTULOS DENTRO DOS BLOCOS ──────────────────────────────────────────
   "Fonte dos títulos" so alcançava h1/h2/h3. Mas o titulo de um card, de uma
   ficha ou de um aviso e um <div> ou <span> com classe — e ficava de fora, o
   que fazia o controle parecer quebrado. Aqui a familia alcanca todos eles.
   O tamanho continua sendo controlado peca a peca, para nao achatar tudo. */
/* `:not(#cvx)` nao casa com nada: serve so para somar especificidade de ID e
   vencer a regra generica de corpo logo abaixo, que tambem alcanca <span>. */
.canvas-bloco-wrap h1, .canvas-bloco-wrap h2, .canvas-bloco-wrap h3, .canvas-bloco-wrap h4,
.canvas-bloco-wrap .cid-title, .canvas-bloco-wrap .eq-step-title, .canvas-bloco-wrap .tl-title,
.canvas-bloco-wrap .kpi-val:not(#cvx), .canvas-bloco-wrap .kpi-lbl, .canvas-bloco-wrap .micro-label,
.canvas-bloco-wrap .a-card-label, .canvas-bloco-wrap .crime-alert-hdr, .canvas-bloco-wrap .eq-f-label,
.canvas-bloco-wrap .crime-row-name, .canvas-bloco-wrap .vs-item-hdr, .canvas-bloco-wrap .pyr-lvl:not(#cvx),
.canvas-bloco-wrap .mm-root:not(#cvx), .canvas-bloco-wrap .mm-branch:not(#cvx),
.canvas-bloco-wrap .vs-card-hdr h2, .canvas-bloco-wrap .crime-card-hdr-text h3 {
  font-family: var(--cv-font-title, 'Baloo 2', sans-serif) !important;
}

/* ── 3c. FONTE E COR DE CADA PARTE ──────────────────────────────────────────
   Uma unica regra atende os 20 papeis: o editor escreve --cvx-peca-font e
   --cvx-peca-c no elemento marcado, e todo o conteudo daquela peca segue.
   Quando a variavel nao existe, o valor e `inherit` — ou seja, nada muda.
   A arvore do KaTeX fica de fora: la a familia e metrica, nao decoracao. */
/* ── 3c. ESPAÇO E LARGURA DE CADA PEÇA ──────────────────────────────────────
   A formatacao de texto de uma peca usa as MESMAS variaveis do slide
   (--cv-font-base, --cv-fs-raw, --cv-font-title, --cv-fs-title, --cvx-txt-c),
   so que escritas na propria peca: por heranca, valem dali para dentro e nao
   tocam em nada fora. Aqui ficam so os controles de caixa da peca. */
/* `:not(#cvx)` sobe a especificidade acima de `.s-body > :first-child`, que
   zera a margem do primeiro bloco e engolia o "Espaço acima" da peça. */
.canvas-bloco-wrap [data-cvx-papel] {
  margin-top:    var(--cvx-peca-mt, 0) !important;
  margin-bottom: var(--cvx-peca-mb, 0) !important;
  max-width:     var(--cvx-peca-w, 100%) !important;
}
/* Desenhos: os limites so entram em cena quando o usuario mexe. Fixar
   `max-height` e `transform` sempre mudava o calculo de altura do T15 e criava
   26px de estouro que nao existia antes — medido em Chrome. */
.canvas-bloco-wrap svg[data-cvx-papel][style*="--cvx-svg-h"]    { max-height: var(--cvx-svg-h) !important; height: auto !important; }
.canvas-bloco-wrap svg[data-cvx-papel][style*="--cv-svg-max-w"] { max-width:  var(--cv-svg-max-w) !important; width: var(--cv-svg-max-w) !important; }
/* Ampliar/reduzir e deslocar: `scale` leva o desenho E os textos juntos, na
   mesma proporcao — e por isso que o texto nunca sai do lugar ao ampliar.
   O deslocamento existe para reencaixar o desenho depois de ampliado. */
.canvas-bloco-wrap svg[data-cvx-papel] {
  transform: translate(var(--cvx-svg-dx, 0px), var(--cvx-svg-dy, 0px)) scale(calc(var(--cvx-svg-esc, 1) * var(--cvx-svg-auto, 1)));
  transform-origin: var(--cvx-svg-orig, center center);
  transform-box: fill-box;
}
.canvas-bloco-wrap svg[data-cvx-papel][style*="--cvx-svg-esc"],
.canvas-bloco-wrap svg[data-cvx-papel][style*="--cvx-svg-dx"],
.canvas-bloco-wrap svg[data-cvx-papel][style*="--cvx-svg-dy"] { overflow: visible; }

/* Rolagem lateral do desenho: o contêiner reage ao modo escolhido */
.canvas-bloco-wrap svg[data-cvx-svgmodo="rolar"]     { max-width: none !important; }
.canvas-bloco-wrap :has(> svg[data-cvx-svgmodo="rolar"])       { overflow-x: auto !important; }
.canvas-bloco-wrap :has(> svg[data-cvx-svgmodo="encolher"])    { overflow-x: hidden !important; }
.canvas-bloco-wrap :has(> svg[data-cvx-svgmodo="nada"])        { overflow-x: visible !important; }

/* NÓS DO DESENHO — cada caixinha/etiqueta do fluxograma vira peça própria */
/* O sistema de revelacao aplica `transform` com !important em todo
   .cv-item-oculto — e os nos do diagrama sao exatamente esses <g>. Por isso o
   controle de mover/ampliar o no so entra quando foi usado, e com prioridade
   suficiente para nao brigar com a animacao de entrada. */
/* o afastamento entra no MESMO transform dos ajustes manuais do no */
/* `!important` porque o sistema de revelacao aplica transform com !important em
   todo .cv-item-oculto — e os nos do desenho sao justamente esses <g>. Como a
   regra so existe quando o usuario usou o afastamento, a animacao de entrada
   dos demais desenhos continua intacta. */
.canvas-bloco-wrap svg[data-cvx-papel="svg"] > g[style*="--cvx-no-espalha"] {
  transform: var(--cvx-no-espalha) !important;
  transform-box: view-box;
}
.canvas-bloco-wrap g[data-cvx-papel="svgno"][style*="--cvx-no-esc"],
.canvas-bloco-wrap g[data-cvx-papel="svgno"][style*="--cvx-no-dx"],
.canvas-bloco-wrap g[data-cvx-papel="svgno"][style*="--cvx-no-dy"] {
  transform: var(--cvx-no-espalha, translate(0px,0px)) translate(var(--cvx-no-dx, 0px), var(--cvx-no-dy, 0px)) scale(var(--cvx-no-esc, 1)) !important;
  transform-origin: center center; transform-box: fill-box;
}
.canvas-bloco-wrap g[data-cvx-papel="svgno"][style*="--cvx-no-fs"] text,
.canvas-bloco-wrap g[data-cvx-papel="svgno"][style*="--cvx-no-fs"] tspan { font-size: var(--cvx-no-fs) !important; }
.canvas-bloco-wrap g[data-cvx-papel="svgno"][style*="--cvx-no-font"] text,
.canvas-bloco-wrap g[data-cvx-papel="svgno"][style*="--cvx-no-font"] tspan { font-family: var(--cvx-no-font) !important; }
.canvas-bloco-wrap g[data-cvx-papel="svgno"][style*="--cvx-no-fw"] text,
.canvas-bloco-wrap g[data-cvx-papel="svgno"][style*="--cvx-no-fw"] tspan { font-weight: var(--cvx-no-fw) !important; }
.canvas-bloco-wrap g[data-cvx-papel="svgno"][style*="--cvx-no-c"] text,
.canvas-bloco-wrap g[data-cvx-papel="svgno"][style*="--cvx-no-c"] tspan { fill: var(--cvx-no-c) !important; }
.canvas-bloco-wrap g[data-cvx-papel="svgno"][style*="--cvx-no-bg"] rect,
.canvas-bloco-wrap g[data-cvx-papel="svgno"][style*="--cvx-no-bg"] polygon,
.canvas-bloco-wrap g[data-cvx-papel="svgno"][style*="--cvx-no-bg"] circle { fill: var(--cvx-no-bg) !important; }
.canvas-bloco-wrap g[data-cvx-papel="svgno"][style*="--cvx-no-borda"] rect,
.canvas-bloco-wrap g[data-cvx-papel="svgno"][style*="--cvx-no-borda"] polygon,
.canvas-bloco-wrap g[data-cvx-papel="svgno"][style*="--cvx-no-borda"] circle,
.canvas-bloco-wrap g[data-cvx-papel="svgno"][style*="--cvx-no-borda"] path { stroke-width: var(--cvx-no-borda) !important; }
.canvas-bloco-wrap svg text, .canvas-bloco-wrap svg tspan {
  font-family: var(--cv-svg-font, 'Nunito Sans', sans-serif) !important;
  font-size:   var(--cvx-svg-fs, inherit) !important;
  font-weight: var(--cvx-svg-fw, inherit) !important;
}
.canvas-bloco-wrap svg[data-cvx-papel][style*="--cvx-svg-c"] text,
.canvas-bloco-wrap svg[data-cvx-papel][style*="--cvx-svg-c"] tspan { fill: var(--cvx-svg-c) !important; }

/* ── 3e. O QUE A PEÇA MANDA NO PRÓPRIO CONTEÚDO ─────────────────────────────
   Auditoria controle a controle mostrou 36 controles inertes. A causa em quase
   todos era a mesma: a variavel existia mas nenhuma regra a lia para AQUELE
   tipo de peca. As regras abaixo usam `[style*="--x"]`, ou seja, so entram em
   acao quando o usuario realmente mexeu naquele controle — nada muda sozinho e
   nenhum controle briga com outro.                                           */

/* entrelinha da peca: a regra do arquivo so cobre p/li/td/span */
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-line-height"],
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-line-height"] *:not(.katex):not(.katex *) {
  line-height: var(--cv-line-height) !important;
}
/* tamanho do texto da peca: sem isto, uma peca feita de <div> (a linha de
   conceito, por exemplo) nao reagia — nenhuma regra aplica font-size a div, e
   o conteudo herdava o tamanho do slide em vez do da peca. */
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-fs-raw"] { font-size: var(--cv-fs-raw) !important; }

/* cor do texto: vale para a peca inteira, nao so para paragrafos */
.canvas-bloco-wrap [data-cvx-papel][style*="--cvx-txt-c"],
.canvas-bloco-wrap [data-cvx-papel][style*="--cvx-txt-c"] *:not(.katex):not(.katex *) {
  color: var(--cvx-txt-c) !important;
}
/* tamanho dos titulos da peca */
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-fs-title"] h1,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-fs-title"] h2,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-fs-title"] h3,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-fs-title"] h4,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-fs-title"] th,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-fs-title"] [class*="-title"],
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-fs-title"] [class*="-label"],
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-fs-title"] [class*="-hdr"],
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-fs-title"] [class*="-lbl"],
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-fs-title"] .kpi-val,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-fs-title"] .crime-row-name,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-fs-title"] .mm-root,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-fs-title"] .mm-branch,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-fs-title"] .pyr-lvl,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-fs-title"] .risk-matrix-row-label,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-fs-title"] .risk-cell,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-fs-title"] .ativo-leg-name {
  font-size: var(--cv-fs-title) !important;
}
/* fonte dos titulos: mesma lista, incluindo o cabecalho da tabela */
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-font-title"] th,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-font-title"] .mm-root,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-font-title"] .mm-branch,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-font-title"] .pyr-lvl,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-font-title"] .kpi-val,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-font-title"] .risk-matrix-row-label,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-font-title"] .risk-cell,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-font-title"] .ativo-leg-name {
  font-family: var(--cv-font-title) !important;
}

/* fonte do corpo da peca: os rotulos da matriz de risco e da legenda tem
   font-family propria com especificidade maior, entao a regra generica de
   descendentes nao os alcancava e o controle "Fonte" ficava inerte neles. */
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-font-base"] .risk-cell,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-font-base"] .risk-matrix-row-label,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-font-base"] .ativo-leg-name,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-font-base"] .ativo-leg-desc,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-font-base"] .kpi-val,
.canvas-bloco-wrap [data-cvx-papel][style*="--cv-font-base"] .pyr-lvl {
  font-family: var(--cv-font-base) !important;
}

/* Caixas: fundo e faixa lateral valem para qualquer caixa, nao so para .card */
.canvas-bloco-wrap [data-cvx-papel="card"][style*="--cvx-card-bg"]    { background: var(--cvx-card-bg) !important; }
.canvas-bloco-wrap [data-cvx-papel="card"][style*="--cvx-card-barra"] { border-left-width: var(--cvx-card-barra) !important; border-left-style: solid !important; }

/* Etiqueta e nome da lista perdiam para a regra generica de <span> do arquivo */
.canvas-bloco-wrap .pill { font-size: var(--cv-pill-fs, var(--cv-fs-micro)) !important; }
.canvas-bloco-wrap .crime-row:not(#cvx) .crime-row-name,
.canvas-bloco-wrap .crime-row > span:first-child { font-size: var(--cvx-row-nome-fs, var(--cv-fs-small)) !important; }

/* FÓRMULA DENTRO DE QUALQUER PEÇA — o pedido de poder ajustar a matematica que
   aparece solta no meio de um card, de uma tabela ou de um aviso. */
.canvas-bloco-wrap [data-cvx-papel][style*="--cvx-fml-esc"] .katex:not(#cvx) { font-size: var(--cvx-fml-esc) !important; }
.canvas-bloco-wrap [data-cvx-papel][style*="--cvx-fml-cor"] .katex:not(#cvx),
.canvas-bloco-wrap [data-cvx-papel][style*="--cvx-fml-cor"] .katex:not(#cvx) * { color: var(--cvx-fml-cor) !important; }
.canvas-bloco-wrap [data-cvx-papel][style*="--cvx-fml-gap"] .katex .mrel { margin-left: var(--cvx-fml-gap) !important; margin-right: var(--cvx-fml-gap) !important; }

/* ── 3e2. ZOOM TIPOGRÁFICO — preenche a altura sem passar da largura ────────
   Usado quando o slide sobra altura mas ja ocupa a largura toda, onde a escala
   uniforme jogaria o conteudo para fora. Multiplica por `calc()`, entao o
   tamanho escolhido no painel continua sendo a base. */
.canvas-bloco-wrap .s-body[style*="--cvx-zoom-txt"] {
  --cv-fs-raw:   calc(var(--cvx-fs-base, 15px) * var(--cvx-zoom-txt));
  --cv-fs-title: calc(var(--cvx-fst-base, 24px) * var(--cvx-zoom-txt));
  --cv-gap:      calc(var(--cvx-gap-base, 20px) * var(--cvx-zoom-txt));
  --cv-pad-card: calc(var(--cvx-padc-base, 18px) * var(--cvx-zoom-txt));
}

/* ── 3f1. CAIXA DE DESENHO DENTRO DE GRADE ──────────────────────────────────
   `.eq-svg-box` tem `max-height: 35vh`. Numa grade de duas colunas isso trava
   a coluna do desenho numa altura menor que a do texto e produz o dente
   (medido: 30% no T01). Dentro de uma grade a caixa acompanha a altura da
   linha; o desenho continua limitado, mas por 100% da caixa, nao por vh. */
.canvas-bloco-wrap .eq-z1 > .eq-svg-box,
.canvas-bloco-wrap [style*="grid-template-columns"] > .eq-svg-box,
.canvas-bloco-wrap .eq-z1 > [class*="-svg"],
.canvas-bloco-wrap [style*="grid-template-columns"] > [class*="-svg"] {
  max-height: 100% !important;
  height: 100% !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}
.canvas-bloco-wrap .eq-z1 > .eq-svg-box > svg,
.canvas-bloco-wrap [style*="grid-template-columns"] > .eq-svg-box > svg {
  max-height: 100% !important;
}

/* ── 3f0. CENTRALIZAÇÃO REAL DA FAIXA ───────────────────────────────────────
   `justify-content:center` no .s-body nao basta: basta um filho com
   `margin: auto` ou `margin-bottom` grande para o conjunto encostar num lado.
   Medido: blocos com 34px de folga em cima e 210px embaixo, visivelmente
   desalinhados. Aqui as margens verticais dos filhos diretos passam a ser
   explicitas (e continuam controlaveis pelo painel, via --cvx-peca-mt/mb). */
.canvas-bloco-wrap .s-body > *:not(#cvx) {
  margin-top:    var(--cvx-peca-mt, 0) !important;
  margin-bottom: var(--cvx-peca-mb, 0) !important;
}

/* ── 3f. SIMETRIA: COLUNAS DA MESMA LINHA COM A MESMA ALTURA ────────────────
   Medido nos 17 blocos: 3 slides com "dentes" — colunas irmãs com alturas
   diferentes (ate 49%), o que da o aspecto de recorte irregular. Os templates
   declaram a grade em `style` inline, entao a regra precisa alcancar qualquer
   contêiner de grade, nao so as classes conhecidas. O mapa mental fica de fora:
   ali os ramos tem tamanhos diferentes por natureza.                        */
.canvas-bloco-wrap .s-body [style*="grid-template-columns"]:not(.cmm-split-wrap):not(:has(> .crime-row)),
.canvas-bloco-wrap .eq-z1, .canvas-bloco-wrap .eq-z2, .canvas-bloco-wrap .crime-grid,
.canvas-bloco-wrap .cid-grid, .canvas-bloco-wrap .vs-grid, .canvas-bloco-wrap .kpi-grid,
.canvas-bloco-wrap .desp-grid, .canvas-bloco-wrap .ativo-grid, .canvas-bloco-wrap .venn-grid,
.canvas-bloco-wrap .kelsen-grid {
  align-items: var(--cvx-grid-align, stretch) !important;
}
/* os filhos diretos preenchem a altura da linha — e o que elimina o dente.
   [FIX] height -> min-height: "height:100%" comprime uma coluna quando ela
   tem mais conteudo que a linha do grid (caso do painel BANCA com 3 cards +
   tabela + pegadinha ao lado da piramide curta), cortando/sobrepondo texto.
   min-height so estica as colunas curtas e nunca encolhe as longas.
   [FIX 2] :not(:has(> .crime-row)) — grids inline que empilham simples
   linhas de texto (ex.: "Passo 1/2/3/4" do T13, listas de .crime-row) NAO
   sao colunas de card e nao devem esticar. min-height:100% neles herdava a
   altura do .s-body/.slide (canvas com altura fixa) e criava caixas vazias
   gigantes no lugar de cada linha — o "estouro" visual reportado no T13. */
.canvas-bloco-wrap .s-body [style*="grid-template-columns"]:not(.cmm-split-wrap):not(:has(> .crime-row)) > *,
.canvas-bloco-wrap .eq-z1 > *, .canvas-bloco-wrap .crime-grid > *,
.canvas-bloco-wrap .cid-grid > *, .canvas-bloco-wrap .vs-grid > *,
.canvas-bloco-wrap .kpi-grid > *, .canvas-bloco-wrap .desp-grid > *,
.canvas-bloco-wrap .ativo-grid > *, .canvas-bloco-wrap .venn-grid > *,
.canvas-bloco-wrap .kelsen-grid > * {
  min-height: var(--cvx-col-altura, 100%) !important;
  align-self: stretch !important;
  box-sizing: border-box !important;
}
/* Grids de linhas de texto (.crime-row) mantêm altura natural do conteúdo. */
.canvas-bloco-wrap .s-body [style*="grid-template-columns"]:has(> .crime-row) {
  align-items: start !important;
}
.canvas-bloco-wrap .s-body [style*="grid-template-columns"]:has(> .crime-row) > .crime-row {
  min-height: auto !important;
  align-self: start !important;
}
/* pilhas verticais dentro de uma coluna distribuem o espaco em vez de
   empilhar tudo em cima e deixar o buraco embaixo */
.canvas-bloco-wrap .crime-stack, .canvas-bloco-wrap .crime-alert-stack, .canvas-bloco-wrap .venn-items {
  display: flex !important; flex-direction: column !important;
  justify-content: var(--cvx-pilha-dist, space-between) !important;
  height: 100% !important;
}

/* ── 3d. LARGURA E POSIÇÃO DA FAIXA DE CONTEÚDO ────────────────────────────
   Tentar encolher cada bloco (`width:auto` nos filhos) NAO funciona: cada
   template trava a largura em um nivel diferente, entao uns reagiam e outros
   nao. Aqui o controle age na FAIXA — o proprio .s-body, que e um elemento so
   e existe em todo slide. Estreitar a faixa estreita tudo junto, sempre. */
/* a escala do auto-caber vive aqui: com `top center`, o conteudo encolhe
   ancorado no topo e nunca sai da area visivel */
/* a escala do auto-ajuste vive aqui: ancorada no topo, o conteudo encolhe ou
   cresce sem sair da area visivel. `width` compensa a escala para a faixa
   continuar ocupando a largura certa depois de ampliada. */
/* Ancorado no CENTRO, nao no topo. Com origem no topo, encolher a lamina
   empurrava todo o conteudo para cima e deixava a sobra inteira embaixo — o
   slide ficava visivelmente desalinhado. Medido: 8 dos 17 blocos com folga de
   cima e de baixo muito diferentes. No centro, a folga fica igual dos dois
   lados, que e o que se espera de uma pagina. */
.canvas-bloco-wrap:not(#cvx) .s-body[style*="--cvx-lamina-auto"],
.canvas-bloco-wrap:not(#cvx) .s-body[style*="--cvx-lamina-dy"] {
  /* CORREÇÃO v78 — nem scaleY() (v76, distorcia) nem scale() (v77, ainda
     redimensionava a FONTE junto, porque transform escala tudo que está
     dentro da caixa, pixel a pixel, texto incluso). Nenhum transform toca
     mais em tamanho de nada aqui.
     O pedido é: cards esticam de forma proporcional (mais respiro), fonte
     NUNCA muda de tamanho. Então o fator de auto-ajuste passa a controlar
     só ESPAÇAMENTO — padding do card e gap entre elementos — nunca
     transform, nunca --cv-fs-*. Quando sobra altura (auto > 1), o respiro
     cresce e o conteúdo "acomoda" dentro do card maior. Quando falta
     altura (auto < 1), o respiro encolhe — a fonte continua do mesmo
     tamanho o tempo todo, comparada slide a slide. */
  --cv-pad-card: calc(clamp(14px, 0.9cqi + 7px, 24px) * var(--cvx-lamina-auto, 1));
  --cv-gap:      calc(clamp(14px, 1.1cqi + 6px, 26px) * var(--cvx-lamina-auto, 1));
  width: var(--cv-largura-palco, 1180px) !important;
  transform: translateY(var(--cvx-lamina-dy, 0px)) !important;
  transform-origin: center center !important;
}

.canvas-bloco-wrap[data-cvx-alinha="esquerda"] .s-body { --cvx-body-ml: 0; --cvx-body-mr: auto; }
.canvas-bloco-wrap[data-cvx-alinha="centro"]   .s-body { --cvx-body-ml: auto; --cvx-body-mr: auto; }
.canvas-bloco-wrap[data-cvx-alinha="direita"]  .s-body { --cvx-body-ml: auto; --cvx-body-mr: 0; }

/* ── 4. GRADES (o que faltava por completo) ─────────────────────────────── */
.canvas-bloco-wrap .eq-z1,
.canvas-bloco-wrap .eq-z2,
.canvas-bloco-wrap .crime-grid,
.canvas-bloco-wrap .cid-grid,
.canvas-bloco-wrap .vs-grid,
.canvas-bloco-wrap .kpi-grid,
.canvas-bloco-wrap .desp-grid,
.canvas-bloco-wrap .ativo-grid,
.canvas-bloco-wrap .venn-grid,
.canvas-bloco-wrap .kelsen-grid,
.canvas-bloco-wrap .risk-legend {
  gap:             var(--cvx-grid-gap, 20px) !important;
  row-gap:         var(--cvx-grid-gap-y, var(--cvx-grid-gap, 20px)) !important;
  align-items:     var(--cvx-grid-align, stretch) !important;
  justify-content: var(--cvx-grid-justify, center) !important;
  max-width:       var(--cvx-grid-max, 1100px) !important;
  margin-left: auto !important; margin-right: auto !important;
  width: var(--cvx-grid-w, 100%) !important;
  min-width: 0 !important;
}
/* Modo AUTO-FIT: substitui as colunas fixas dos templates por auto-fit real.
   Só entra em ação quando --cvx-grid-modo = "auto" (o editor troca o atributo
   data-cvx-grid no wrapper); no modo "template" nada muda. */
.canvas-bloco-wrap[data-cvx-grid="auto"] .eq-z1,
.canvas-bloco-wrap[data-cvx-grid="auto"] .crime-grid,
.canvas-bloco-wrap[data-cvx-grid="auto"] .cid-grid,
.canvas-bloco-wrap[data-cvx-grid="auto"] .vs-grid,
.canvas-bloco-wrap[data-cvx-grid="auto"] .kpi-grid,
.canvas-bloco-wrap[data-cvx-grid="auto"] .desp-grid,
.canvas-bloco-wrap[data-cvx-grid="auto"] .ativo-grid,
.canvas-bloco-wrap[data-cvx-grid="auto"] .venn-grid,
.canvas-bloco-wrap[data-cvx-grid="auto"] .kelsen-grid {
  grid-template-columns: repeat(auto-fit, minmax(var(--cv-col-min, 280px), 1fr)) !important;
}

/* ── 5. CAIXAS (família de cards) ───────────────────────────────────────── */
.canvas-bloco-wrap .card,
.canvas-bloco-wrap .a-card,
.canvas-bloco-wrap .cid-card,
.canvas-bloco-wrap .vs-card,
.canvas-bloco-wrap .crime-card,
.canvas-bloco-wrap .crime-alert,
.canvas-bloco-wrap .kpi-card,
.canvas-bloco-wrap .eq-step-card,
.canvas-bloco-wrap .eq-sintese-box,
.canvas-bloco-wrap .cmp-card,
.canvas-bloco-wrap .exec-step-card {
  padding:       var(--cv-pad-card, 18px) !important;
  border-radius: var(--cv-radius-card, 12px) !important;
  border-width:  var(--cv-card-border, 1px) !important;
  border-style:  solid !important;
  border-color:  var(--cvx-card-border-c, var(--border, #e2e8f0)) !important;
  box-shadow:    var(--cvx-card-shadow, 0 2px 8px rgba(0,0,0,.04)) !important;

/* ── 12. PIRÂMIDE ───────────────────────────────────────────────────────── */

/* ── 14. TIPOLOGIA / COMPARAÇÃO / LEGENDA ───────────────────────────────── */
.canvas-bloco-wrap .cid-grid { grid-template-columns: repeat(var(--cv-cid-cols, 3), 1fr) !important; }
/* [REMOVIDO A10 — regra 100% morta, sobreposta por camada posterior; ver relatorio-auditoria-camadas-v15-v50-notcvx.md] */
.canvas-bloco-wrap .cid-desc  { font-size: var(--cvx-cid-desc-fs, var(--cv-fs-raw, clamp(14px, 1.2cqi + 8px, 22px))) !important; line-height: var(--cvx-cid-desc-lh, 1.6) !important; text-align: center !important; }
/* [REMOVIDO A11 — regra 100% morta, sobreposta por camada posterior; ver relatorio-auditoria-camadas-v15-v50-notcvx.md] */

.canvas-bloco-wrap .vs-grid { grid-template-columns: repeat(var(--cv-vs-cols, 2), 1fr) !important; }

/* ── 15. SVG ────────────────────────────────────────────────────────────── */
/* Cap de altura em vh nas 4 caixas nomeadas removido daqui — duplicava a
   seção "2b" (fonte única, dimensionamento relativo ao contêiner). Mantido
   apenas para outros wrappers "-svg" fora do escopo do Bug A (ex.: .canvas-svg-wrapper). */
.canvas-bloco-wrap [class*="-svg"]:not(.eq-svg-box):not(.exec-svg-box) { max-height: var(--cv-svg-max-h, 35vh) !important; }
.canvas-bloco-wrap svg { max-height: var(--cvx-svg-h, none) !important; max-width: var(--cv-svg-max-w, 100%) !important; }
.canvas-bloco-wrap svg text {
  font-family: var(--cv-svg-font, 'Nunito Sans', sans-serif) !important;
  font-size:   var(--cvx-svg-fs, inherit) !important;
  font-weight: var(--cvx-svg-fw, inherit) !important;
}

/* ── 16. MAPA MENTAL (T14) ──────────────────────────────────────────────── */
.canvas-bloco-wrap .mm-root       { min-width: var(--cv-mm-minw, 160px) !important; }
.canvas-bloco-wrap .mm-branch-wrap{ gap: var(--cv-mm-gap, 36px) !important; }
.canvas-bloco-wrap .mm-branch     { font-size: var(--cvx-mm-branch-fs, inherit) !important; }
.canvas-bloco-wrap .mm-mid        { font-size: var(--cvx-mm-mid-fs, inherit) !important; }
.canvas-bloco-wrap .mm-sub        { font-size: var(--cvx-mm-sub-fs, inherit) !important; }

/* ── 17. REVELAÇÃO PROGRESSIVA ──────────────────────────────────────────── */
.canvas-bloco-wrap .cv-item-oculto {
  transform: translateY(var(--cvx-reveal-desl, 8px)) scale(var(--cvx-reveal-escala, .97)) !important;
}
.canvas-bloco-wrap .cv-item-revelado {
  transition: all var(--cvx-reveal-dur, .4s) cubic-bezier(.25,1,.5,1) !important;
}

/* ══════════════════════════════════════════════════════════════════════════
   18. MOTOR FINO DE FÓRMULA (KaTeX)

   O que é CSS puro fica aqui. O que depende de mexer no `top` inline que o
   KaTeX escreve nas .vlist (elevação de expoente, afastamento de fração,
   espaço entre linhas de matriz) é feito no JS por `_cvxAjustarFormulas`,
   porque CSS não consegue somar a um `top` inline.
   ────────────────────────────────────────────────────────────────────────── */

/* 18.1 — Contêiner da fórmula: alinhamento H e V, respiro, borda */
.canvas-bloco-wrap .mono-box,
.canvas-bloco-wrap .exec-mono-box,
.canvas-bloco-wrap .eq-math-card,
.canvas-bloco-wrap .eq-f-formula,
.canvas-bloco-wrap .fml-main {
  padding:        var(--cv-formula-pad, 14px) var(--cvx-fml-pad-x, 20px) !important;
  border-width:   var(--cv-formula-border, 1px) !important;
  border-radius:  var(--cvx-fml-radius, var(--cv-radius-card, 12px)) !important;
  background:     var(--cvx-fml-bg, var(--bg-subtle)) !important;
  display:        flex !important;
  flex-direction: row !important;
  justify-content:var(--cv-formula-align, center) !important;
  align-items:    var(--cvx-fml-align-v, center) !important;
  text-align:     var(--cvx-fml-text-align, center) !important;
  min-height:     var(--cvx-fml-minh, 0px) !important;
  overflow-x:     var(--cvx-fml-overflow, auto) !important;
  overflow-y:     hidden !important;
  max-width:      100% !important;
  box-sizing:     border-box !important;
}

/* 18.2 — Tipografia da fórmula */
/* `:not(#cvx)` soma especificidade de ID sem casar com nada: e o que faz esta
   regra vencer `.canvas-bloco-wrap .mono-box .katex` e as regras genericas de
   span do arquivo, que travavam a formula em 15px / Nunito Sans. */
.canvas-bloco-wrap .katex {
  font-family: var(--cvx-fml-font, KaTeX_Main, 'Times New Roman', serif) !important;
  font-size:   var(--cv-formula-fs, 1.3em) !important;
  line-height: var(--cvx-fml-lh, 1.2) !important;
  color:       var(--cvx-fml-c, inherit) !important;
}
/* Dentro do KaTeX, os spans internos precisam voltar a herdar a familia e a
   manter o proprio font-size em `em` — e assim que o motor posiciona expoente,
   fracao e delimitador. Qualquer px fixo aqui quebra a matematica. */
.canvas-bloco-wrap .katex span,
.canvas-bloco-wrap .katex .mord,
.canvas-bloco-wrap .katex .mrel,
.canvas-bloco-wrap .katex .mbin {
  font-family: inherit !important;
  line-height: normal !important;
}
.canvas-bloco-wrap .katex-display { margin: var(--cvx-fml-disp-mg, 10px 0) !important; }
.canvas-bloco-wrap .katex-display > .katex { text-align: var(--cvx-fml-text-align, center) !important; }

/* 18.3 — ESPAÇO ANTES E DEPOIS DO IGUAL (e de todo relacional: = ≠ ≤ ≥ → ⟹) */
.canvas-bloco-wrap .katex .mrel {
  margin-left:  var(--cvx-fml-gap-rel, 0.2778em) !important;
  margin-right: var(--cvx-fml-gap-rel, 0.2778em) !important;
}
/* 18.4 — Espaço dos operadores binários (+ − × ÷ ·) */
.canvas-bloco-wrap .katex .mbin {
  margin-left:  var(--cvx-fml-gap-bin, 0.2222em) !important;
  margin-right: var(--cvx-fml-gap-bin, 0.2222em) !important;
}
/* 18.5 — Espaço entre elementos ordinários (letras, números, símbolos) */
.canvas-bloco-wrap .katex .mord + .mord { margin-left: var(--cvx-fml-gap-ord, 0em) !important; }
.canvas-bloco-wrap .katex .mpunct { margin-right: var(--cvx-fml-gap-punct, 0.1667em) !important; }
/* 18.6 — Espaço em torno de parênteses/colchetes/delimitadores */
.canvas-bloco-wrap .katex .mopen  { margin-right: var(--cvx-fml-gap-delim, 0em) !important; }
.canvas-bloco-wrap .katex .mclose { margin-left:  var(--cvx-fml-gap-delim, 0em) !important; }

/* 18.7 — FRAÇÃO: espessura da barra (o afastamento vertical é feito no JS) */
.canvas-bloco-wrap .katex .frac-line {
  border-bottom-width: var(--cvx-fml-frac-line, 0.04em) !important;
  border-bottom-color: var(--cvx-fml-frac-c, currentColor) !important;
}
.canvas-bloco-wrap .katex .mfrac { font-size: var(--cvx-fml-frac-escala, 1em) !important; }

/* 18.8 — EXPOENTE E ÍNDICE: escala (a elevação/rebaixamento é feita no JS) */
.canvas-bloco-wrap .katex .msupsub { font-size: var(--cvx-fml-sup-escala, 1em) !important; }

/* 18.9 — MATRIZES: espaço entre colunas */
.canvas-bloco-wrap .katex .arraycolsep { width: var(--cvx-fml-mat-colgap, 0.5em) !important; }
.canvas-bloco-wrap .katex .mtable { font-size: var(--cvx-fml-mat-escala, 1em) !important; }
.canvas-bloco-wrap .katex .mtable .col-align-c > .vlist-t { text-align: center !important; }
/* delimitadores da matriz (colchetes/parênteses) */
.canvas-bloco-wrap .katex .delimsizing,
.canvas-bloco-wrap .katex .delim-size1 > span,
.canvas-bloco-wrap .katex .delim-size4 > span { color: var(--cvx-fml-delim-c, inherit) !important; }

/* 18.10 — Raiz, sobrelinha e acentos acompanham a espessura da fração */
.canvas-bloco-wrap .katex .sqrt > .sqrt-line,
.canvas-bloco-wrap .katex .overline > .overline-line,
.canvas-bloco-wrap .katex .underline > .underline-line {
  border-bottom-width: var(--cvx-fml-frac-line, 0.04em) !important;
}

/* 18.11 — AJUSTE DE LARGURA: o JS marca data-cvx-fit no contêiner.
   "escala"  = encolhe a fórmula até caber (mata o overflow_horizontal)
   "rolagem" = mantém o tamanho e libera a rolagem lateral
   "nenhum"  = comportamento cru                                              */
/* `:not(#cvx)` para vencer a regra da caixa de formula, que fixa overflow-x e
   tem a mesma especificidade — sem isto, escolher "deixar passar da borda" nao
   surtia efeito nenhum. */
.canvas-bloco-wrap [data-cvx-fit="escala"] { overflow-x: hidden !important; }
.canvas-bloco-wrap [data-cvx-fit="escala"] > .katex,
.canvas-bloco-wrap [data-cvx-fit="escala"] > .katex-display {
  transform: scale(var(--cvx-fit-escala, 1));
  transform-origin: var(--cvx-fml-origem, center center);
}
.canvas-bloco-wrap [data-cvx-fit="rolagem"] { overflow-x: auto !important; }
.canvas-bloco-wrap [data-cvx-fit="nenhum"]  { overflow-x: visible !important; overflow-y: visible !important; }

/* 18.12 — Fórmula solta no meio da prosa (span[data-tex] inline) */
/* Fórmula solta no meio da prosa. O fallback encadeia no tamanho de fórmula
   da peça: sem isto, a matemática dentro de um aviso ou de uma tabela ficava
   presa em 1em e o controle de tamanho da peça não surtia efeito. */
.canvas-bloco-wrap span[data-tex] .katex,
.canvas-bloco-wrap p .katex,
.canvas-bloco-wrap td .katex,
.canvas-bloco-wrap .vs-item-txt .katex,
.canvas-bloco-wrap .a-card-desc .katex,
.canvas-bloco-wrap .kpi-note .katex { font-size: var(--cv-formula-fs, 1em) !important; }


/* =========================================================================
   BLOCO ADICIONAL — CHECKLIST DE VALIDACAO POS-REFATORACAO (2026-08)
   Fica no FIM de proposito, seguindo a mesma convencao do resto do arquivo:
   mesma especificidade + !important vence por POSICAO, sem precisar
   inflar seletor nem duplicar regras ja existentes.
========================================================================= */

/* ── A. GRADE INTELIGENTE 2x2 PARA EXATAMENTE 4 ITENS (checklist 2.3) ──
   Corrige o layout "3 em cima + 1 isolado embaixo" (--cv-cid-cols/--cv-vs-cols
   default = 3/2) quando o card tem exatamente 4 filhos. So ativa com 4 (nao
   com 5+), por isso o :not(:has(> :nth-child(5))). */
.canvas-bloco-wrap .cid-grid:has(> :nth-child(4)):not(:has(> :nth-child(5))),
.canvas-bloco-wrap .vs-grid:has(> :nth-child(4)):not(:has(> :nth-child(5))) {
  grid-template-columns: 1fr 1fr !important;
}

/* ── B. CONTENCAO DO GRAFICO DE BARRAS (T05) — checklist matriz de validacao ──
   Evita que a caixa do grafico empurre a tabela comparativa para fora da
   viewport em 1080p. */
.canvas-bloco-wrap .slide[data-tpl="T05"] .desp-grid .card:last-child {
  max-height: 320px !important;
  padding: 16px !important;
  display: flex !important;
  align-items: center !important;
}
.canvas-bloco-wrap .slide[data-tpl="T05"] .desp-grid svg {
  max-height: 100% !important;
  height: auto !important;
  width: 100% !important;
}

/* ── C. LEGENDA ANTI-COLISAO NA MATRIZ DE RISCO (T07) — checklist item 8 ──
   .risk-leg-item hoje e flex simples (selo + texto na mesma linha), o que
   deixa o selo (CRITICO/ATENCAO/BASE) sobrepondo o texto quando o texto e
   longo. Convertido para grid com coluna fixa para o selo, igual ao padrao
   ja usado em .risk-matrix-hdr/.risk-matrix-row neste mesmo arquivo. */
.canvas-bloco-wrap .risk-leg-item {
  display: grid !important;
  grid-template-columns: 90px 1fr !important;
  align-items: center !important;
  gap: 16px !important;
}
.canvas-bloco-wrap .risk-leg-item .risk-leg-badge {
  width: 100% !important;
  text-align: center !important;
  margin: 0 !important;
}

/* =========================================================================
   [FIX] REDE DE SEGURANCA ESTRUTURAL DA LOUSA (evita transbordamentos)
   Inserido ANTES do fechamento da tag de estilo, de proposito: colado
   depois do fechamento cairia fora do escopo CSS e seria ignorado pelo
   navegador, sem erro nenhum no console.
========================================================================= */

/* 1. Contenção absoluta de etiquetas (impede vazamento horizontal).
      Causa raiz confirmada em capacidade_subblocos_FINAL.json: .pill usa
      white-space:nowrap sem max-width — teto de 25 caracteres no prompt
      (ORÇAMENTO MATEMÁTICO DE CARACTERES) reduz a chance de estourar, mas
      esta regra é o piso de segurança para quando mesmo assim estourar. */
.canvas-bloco-wrap .pill,
.canvas-bloco-wrap .risk-leg-badge,
.canvas-bloco-wrap .exec-pill {
    max-width: 100% !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
    white-space: nowrap !important;
}

/* 2. Corrige o H3 do Card de Crime (T02): a regra global de títulos em
      var(--cv-fs-title, 24px) !important (linha ~8269) vencia a regra
      específica de 13px (linha ~3986) por !important + ordem de fonte.
      Esta regra, por vir depois e ter a MESMA especificidade + !important,
      volta a vencer. */
.canvas-bloco-wrap .crime-card-hdr-text h3 {
    font-size: var(--cv-fs-small) !important;
    line-height: 1.4 !important;
    white-space: normal !important;

/* ══════════════════════════════════════════════════════════════════════════
   CAMADA FINAL — LÂMINA COM PISO MÍNIMO (nunca fica ilegível, nunca estoura)
   ──────────────────────────────────────────────────────────────────────────
   Ajuste em cima do feedback: desligar 100% a escala deixou o conteúdo no
   tamanho "natural" dele, que em templates com SVG/grades grandes passa da
   tela e força rolagem — o oposto do que se queria. A correção não é "sem
   escala nenhuma" nem "escala solta": é escala DENTRO DE LIMITES.
     • encolhe (`_cvxAjustarLamina`, JS) só até um piso legível — ver o
       `Math.max(0.72, ...)` no JS: nunca passa disso, então nunca fica
       pequeno demais nem quebra a simetria entre slides;
     • cresce até um teto (`data-cvx-lamina-max`, default 1.35) quando sobra
       espaço, preenchendo a tela em vez de deixar vazio embaixo;
     • fica ancorado no topo por padrão (flex-start) e a própria função JS
       centraliza verticalmente via translateY quando o conteúdo cabe;
     • se ainda assim, no piso mínimo, o conteúdo não couber (caso raro,
       templates monstruosamente densos), overflow-y:auto entra como rede de
       segurança — rola em vez de cortar ou sobrepor.

   Especificidade 0-4-0 (dois `:not()` de atributo) — maior que qualquer
   ".canvas-bloco-wrap .s-body" solto no resto do arquivo (0-2-0) e maior que
   o seletor condicional da lâmina antiga (0-3-0). Estas regras vencem sempre,
   por especificidade, não por posição no arquivo.

   Margem lateral: propositalmente NÃO redefinida aqui — continua vindo de
   --cv-pad-palco (default 40px), que já é o MESMO valor em todos os 17
   templates. Se a margem parecer diferente entre slides, o motivo é o
   conteúdo interno (SVG/grade com largura própria), não o padding do corpo;
   ajuste a viewBox/max-width do elemento específico do template, não aqui.

   T14 (mapa mental) e wrappers com data-mapa="1" ficam de fora: o pan/zoom
   deles usa outro transform e não deve ser tocado por esta camada.
   ══════════════════════════════════════════════════════════════════════════ */

.canvas-bloco-wrap:not([data-tpl="T14"]):not([data-mapa="1"]) .s-body {
    display: flex !important;
    flex-direction: column !important;
    justify-content: flex-start !important;   /* base ancorada no topo; o JS centraliza via translateY quando cabe */
    align-items: stretch !important;

    height: auto !important;
    max-height: 100% !important;              /* nunca maior que o slide — quem passar do piso mínimo, rola */

    overflow-y: auto !important;               /* rede de segurança, não o método principal */
    overflow-x: hidden !important;

    transition: none !important;                /* muda de tamanho na hora, sem animação — fim do tremor */

    scrollbar-width: thin !important;               /* [REDE-DE-SEGURANCA-VISIVEL] Firefox: barra fina, nao mais invisivel */
    scrollbar-color: var(--border, #d0d5dd) transparent !important;
}

/* [REDE-DE-SEGURANCA-VISIVEL] idem — ver justificativa em ~linha 3858. */
.canvas-bloco-wrap:not([data-tpl="T14"]):not([data-mapa="1"]) .s-body::-webkit-scrollbar {
    display: block !important;
    width: 5px !important;
    background: transparent !important;
}
.canvas-bloco-wrap:not([data-tpl="T14"]):not([data-mapa="1"]) .s-body::-webkit-scrollbar-thumb {
    background: var(--border, #d0d5dd) !important;
    border-radius: 4px !important;
}

/* Ninguém é espremido pelo flexbox — cada peça mantém a altura que o próprio
   conteúdo pede. É isto que impede caixas vazias/achatadas em conteúdo denso. */
.canvas-bloco-wrap:not([data-tpl="T14"]):not([data-mapa="1"]) .s-body > * {
    flex-shrink: 0 !important;
    min-height: max-content !important;
}

/* FIX (definitivo — vence preferência já salva no projeto): o painel de
   configurações grava --cv-justify:center via inline style
   (wrapEl.style.setProperty, sem 'important') sempre que o projeto já tinha
   essa preferência salva de antes — o que faz o default novo do painel
   (flex-start) nunca ser lido nesses projetos já existentes. Regra de
   stylesheet com !important vence inline style sem !important, então isto
   força flex-start em qualquer slide, independente do que já foi salvo. */
.canvas-bloco-wrap .s-body {
    --cv-justify: flex-start !important;
}

/* FIX (correção de inconsistência entre blocos): cards ad-hoc que só definem
   min-height inline (ex.: diagramas tipo T17 "Montagem Estrutural da Matriz")
   NÃO são .eq-svg-box/.exec-svg-box — esses já têm regra própria (linha ~8117)
   pensada para diagramas que devem preencher a largura da célula do grid.
   Aqui o SVG é desenhado com viewBox compacto (ex.: 400x230) para caber no
   min-height declarado; a regra global de SVG (width:100% !important, linha
   ~8101) ignora isso e estica o SVG além do min-height, inchando o card.
   Esse inchaço faz o slide inteiro "estourar" em _cvxAjustarLamina() e a
   fonte do bloco inteiro cair até o piso 0.72 — a causa da letra minúscula
   e do scroll observados no bloco "Construção de Matriz por Lei de Formação".
   Maior especificidade que a regra genérica garante que este seletor vence
   independente da ordem no arquivo. */
.canvas-bloco-wrap .card[style*="min-height"] svg {
    /* CORREÇÃO v76: max-height:100% aqui nunca funcionou — o .card pai só
       tem min-height (sem height própria), então 100% resolve para "none"
       pela spec do CSS (% de altura contra ancestral sem altura definida
       é ignorado). Resultado medido ao vivo: SVG de viewBox 340×250
       renderizando a 864px de altura, estourando a página e forçando
       scroll. Teto em vh é uma referência real — sempre funciona,
       independente da altura do ancestral. */
    width: auto !important;
    height: auto !important;
    max-width: 100% !important;
    max-height: min(46vh, 480px) !important;
}

/* [REMOVIDO — V51] Havia aqui uma regra "restauradora" tentando reverter,
   por especificidade, o efeito do seletor global de SVG (então em
   `.canvas-bloco-wrap:not([data-mapa="1"]) svg { width:auto!important;
   height:auto!important }`, linha ~7958) sobre SVGs com width/height fixos
   em px. Essa regra estava QUEBRADA: um comentário fechado, seguido de
   texto solto terminando noutro fecha-comentário sem abertura correspondente
   — CSS inválido, cujo resultado real em navegador é o parser tentar
   consumir o texto solto como parte do seletor da regra seguinte e
   descartar a regra inteira por seletor malformado. Ou seja: além de
   redundante, não estava nem funcionando.
   Foi substituída pela correção na origem (não mais um contra-patch): o
   seletor global de SVG em si (linha ~7958) agora só aplica width:auto e
   height:auto a SVGs sem width/height fixo ou com valor percentual — SVGs
   com width/height numéricos em px mantêm o próprio tamanho, sem precisar
   de nenhuma regra posterior desfazendo o override. O teto de overflow
   (max-width/max-height) já é aplicado ali mesmo, incondicionalmente, para
   qualquer SVG. Nada a reverter aqui. */

/* ══════════════════════════════════════════════════════════════════════════
   V51 — SISTEMA DE FONTES CONSOLIDADO (fonte única da verdade)
   ──────────────────────────────────────────────────────────────────────────
   Levantamento encontrou classes "comuns" (mesmo papel semântico em
   templates diferentes) com DUAS definições conflitantes espalhadas pelas
   camadas históricas V15-V50 — a que vence depende só da ordem no arquivo,
   não de intenção. Este bloco é a camada final: sempre vence por ser a
   última !important de igual ou maior especificidade. As regras antigas
   NÃO foram apagadas (risco de remover algo que resolvia outro sintoma
   sem eu entender o motivo original) — apenas deixam de ter efeito.

   CONFLITOS REAIS ENCONTRADOS (valor efetivo antes desta correção, por
   ordem de cascata — o segundo valor era o que realmente renderizava):
     .kpi-lbl               linha 4182: --cv-fs-caption (11px)  vs  linha 8675: --cv-fs-micro (10px)
     .kpi-val                linha 4181: --cv-fs-hero (34px, fixo) vs linha 8674: clamp(26px,3vh,34px)
     .kpi-note                linha 4183: --cv-fs-small (12.5px) vs linha 8676: var(--cv-fs-raw) ← preso ao zoom dinâmico da lâmina, não deveria ser
     .tl-title (fase da timeline) linha 4193: --cv-fs-small (12.5px) vs linha 8682: 16px fixo (nem token da escala é)
     .vs-item-hdr              linha 4127: --cv-fs-micro (10px) vs linha 8710: --cv-fs-small (12.5px)
     .exec-table td            linha 4199: --cv-fs-body (14px) vs linha 6678: --cv-fs-small (12.5px)
     .mm-branch                linha 8733: inherit (varia com profundidade do ramo, imprevisível)
   Critério de aceite (auditoria original): dois elementos do mesmo tipo
   semântico em templates diferentes devem ter o MESMO font-size computado
   quando nenhum ajuste de lâmina/zoom estiver ativo. As escolhas abaixo
   seguem o padrão majoritário já usado por classes irmãs da mesma família.
   ══════════════════════════════════════════════════════════════════════════ */

/* Categoria: TÍTULO DE CARD / RÓTULO DE SEÇÃO (mesmo peso visual em qualquer template)
   já eram consistentes entre si — mantidos como âncora da categoria: cid-title,
   crime-row-name, risk-cell. tl-title estava destoando (16px "solto") e passa
   a acompanhar o grupo. TRADE-OFF: tl-title fica ~3.5px menor que antes —
   ganha consistência entre T02/T04/T11, perde um pouco de destaque próprio
   do T11. Se preferir tl-title mais proeminente, é a única exceção que faria
   sentido declarar isolada (ex.: --cv-fs-subtitle) — decisão sua. */
.canvas-bloco-wrap .tl-title,
.canvas-bloco-wrap .cid-title,
.canvas-bloco-wrap .crime-row-name,
.canvas-bloco-wrap .risk-cell,
.canvas-bloco-wrap .pyr-lvl {
  font-size: var(--cv-fs-small) !important;
}

/* Categoria: RÓTULO PEQUENO / MICRO-LABEL (abaixo de valor numérico, badge,
   cabeçalho de alerta, cabeçalho de vs-item) — todos ao mesmo tamanho mínimo. */
.canvas-bloco-wrap .kpi-lbl,
.canvas-bloco-wrap .vs-item-hdr,
.canvas-bloco-wrap .a-card-label,
.canvas-bloco-wrap .crime-alert-hdr,
.canvas-bloco-wrap .eq-f-label,
.canvas-bloco-wrap .pill,
.canvas-bloco-wrap .micro-label {
  font-size: var(--cv-fs-micro) !important;
}

/* Categoria: TEXTO SECUNDÁRIO / NOTA / CÉLULA DE TABELA / LEGENDA DE EIXO
   — kpi-note volta a ser um tamanho fixo (deixa de depender de --cv-fs-raw,
   que é a variável dinâmica ligada ao zoom da lâmina; um rótulo de apoio não
   deve mudar de tamanho por causa do ajuste automático de OUTRO slide). */
.canvas-bloco-wrap .kpi-note,
.canvas-bloco-wrap .risk-matrix-row-label {
  font-size: var(--cv-fs-caption) !important;
}

/* exec-table: td volta ao tamanho original (corpo de texto), não ao "small"
   que uma camada posterior aplicou por engano — cabeçalho (th, já em micro)
   e célula (td) precisam ter contraste de peso, não ficarem quase iguais. */
.canvas-bloco-wrap .exec-table td {
  font-size: var(--cv-fs-body) !important;
}

/* Categoria: VALOR NUMÉRICO GRANDE (KPI hero) — tamanho fixo, não clamp por
   viewport-height (o clamp fazia o MESMO layout kpi ter tamanho diferente
   dependendo da altura da janela, não da quantidade de conteúdo — o tipo de
   variação que este sistema existe pra eliminar). */
.canvas-bloco-wrap .kpi-val {
  font-size: var(--cv-fs-hero) !important;
}

/* mm-branch (mapa mental): tamanho próprio fixo em vez de "inherit" — como
   herdava do ancestral, dois ramos na mesma árvore podiam ter tamanho
   diferente só por profundidade de aninhamento no HTML gerado. */
.canvas-bloco-wrap .mm-branch {
  font-size: var(--cv-fs-body) !important;
}


/* ══════════════════════════════════════════════════════════════════════════
   V51 — SISTEMA DE ESPAÇAMENTO: CONFIRMAÇÃO DE ESCOPO (nenhuma correção
   estrutural necessária além do que já existe)
   ──────────────────────────────────────────────────────────────────────────
   Auditoria dedicada verificou as 3 variáveis universais já em uso:
     --cv-pad-palco (margem externa do slide) — 1 única definição de base
       (clamp 24-56px) + 1 versão escalada por zoom (uso legítimo, parte do
       mecanismo de "preencher o que sobra" do _cvxAjustarLamina, não uma
       gambiarra por template).
     --cv-gap (espaço entre cards/seções) — mesmo padrão acima, 1 base + 1
       escalada por zoom.
     --cv-pad-card (padding interno de card) — idem, aplicado uniformemente
       via seletor coringa [class*="-card"], [class*="-box"], [class*="-panel"]
       a QUALQUER card de QUALQUER template, sem exceção por nome de classe.
   Únicas duas exceções por posição encontradas dentro do escopo
   .canvas-bloco-wrap (margin-top:0 em :first-child) são justificadas por
   razão de layout universal (evitar respiro duplo no topo do primeiro
   elemento) e não são específicas de nenhum template — mantidas como estão,
   conforme a restrição do escopo original de só remover patch que seja
   gambiarra pontual, não regra genuinamente universal.
   ══════════════════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════════════════
   V52 — FIX: BURACO VAZIO EM .crime-stack / .crime-alert-stack
   ──────────────────────────────────────────────────────────────────────────
   DIAGNÓSTICO: a regra em ~L8532 (".crime-stack, .crime-alert-stack, .venn-items")
   usa "justify-content: space-between" para esticar a pilha até 100% da altura
   da coluna irmã (regra de simetria da seção 3f). Isso NÃO preenche o
   espaço — só empurra os cards/alertas para as bordas e abre vãos vazios e
   desiguais entre eles (o desperdício visível no crime-grid: o
   crime-card-body sobra em branco embaixo das linhas, e os 3 crime-alert
   ficam esparramados com buracos entre si).
   FIX REAL (não é mais um patch por cima do patch): o espaço extra da coluna
   deixa de virar vão morto entre os itens e passa a virar respiro DENTRO de
   cada item — cada crime-alert e o corpo de cada crime-card viram flex
   containers que dividem a altura sobrando entre si e centralizam o próprio
   conteúdo. Resultado: cards e alertas maiores e mais confortáveis de ler,
   preenchendo a coluna de ponta a ponta sem buraco em branco em lugar nenhum.
   ══════════════════════════════════════════════════════════════════════════ */
.canvas-bloco-wrap .crime-stack,
.canvas-bloco-wrap .crime-alert-stack,
.canvas-bloco-wrap .venn-items {
  justify-content: flex-start !important;
}

.canvas-bloco-wrap .crime-alert-stack > .crime-alert {
  flex: 1 1 0 !important;
  display: flex !important;
  flex-direction: column !important;
  justify-content: center !important;
}

.canvas-bloco-wrap .crime-card-body {
  justify-content: center !important;
}

/* ══════════════════════════════════════════════════════════════════════════
   V65 — SISTEMA VISUAL "LIVRO DIDÁTICO FLAT"  (21/ago/2026)
   ──────────────────────────────────────────────────────────────────────────
