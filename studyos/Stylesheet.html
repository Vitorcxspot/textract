   Camada FINAL do arquivo. Não apaga nada: vence por posição e, onde a regra
   antiga tinha especificidade alta (0-4-0), por `:not(#cvx)` — pseudo-classe
   que não casa com nada e só soma peso de ID.

   O QUE ESTA CAMADA CORRIGE (tudo medido em Chrome headless, lousa real de
   19 blocos, 12 templates, nas resoluções 2560x1080 e 1440x900):

   1. ULTRAWIDE — a faixa estava travada em 1280px fixos: em 2560px o conteúdo
      ocupava 46% da tela e o resto virava vazio; com --cv-body-max salvo alto
      (o editor permite até 2400) ela ia ao extremo oposto e esticava de ponta
      a ponta. Agora a faixa é FLUIDA COM TETO: cresce com a tela até um limite
      de leitura e nunca passa dele, esteja salvo o que estiver.
   2. DESPROPORÇÃO DE FONTE — a escala tinha 8 valores fixos (10px..34px) e o
      zoom automático variava de 0,72x a 1,60x conforme o bloco: dois slides da
      mesma lousa tinham o MESMO papel tipográfico em tamanhos 2,2x diferentes.
      Agora todos os degraus DERIVAM de uma base única por `calc()`: mudou a
      base, muda tudo junto, na mesma proporção.
   3. PASTEL — os fundos de destaque eram cores saturadas claras (#BAE6FD,
      #FDE68A, #FECACA, #A7F3D0) que brigam com o texto. Trocados por tinta
      sólida + fundo de 8% da própria cor sobre branco: contraste de livro
      impresso, sem "papel de parede".
   4. BURACOS — pilhas e grades usavam altura de conteúdo dentro de contêiner
      de altura total: sobrava vão morto no rodapé (a queixa do "outdoor" na
      pirâmide T08 e do gap sob as fórmulas). Agora as faixas dividem a altura.
   5. ESTABILIZAÇÃO — o slide aparecia e se remexia (3 passadas de ajuste
      visíveis, a "convulsão"). O JS agora só revela depois de estabilizar;
      aqui fica o estado oculto e a revelação única.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── 65.1 · PALETA — TINTA SÓLIDA, FUNDO DE 8%, ZERO PASTEL ───────────────── */
.canvas-bloco-wrap {
  --bg-page:     #FFFFFF;
  --bg-panel:    #FFFFFF;
  --bg-subtle:   #F7F8FA;
  --border:      #E4E7EC;
  --border-soft: #F0F2F5;

  --text-900: #101828;
  --text-600: #475467;
  --text-400: #667085;
  --navy:     #0B1220;

  --blue-700: #1D4ED8;
  --blue-500: #2563EB;
  --blue-100: #EAF0FE;      /* era #BAE6FD (pastel saturado) */
  --red-600:  #B42318;
  --red-100:  #FDECEA;      /* era #FECACA */
  --green-600:#067647;
  --green-100:#E7F6EF;      /* era #A7F3D0 */
  --amber-600:#B54708;
  --amber-100:#FDF3E8;      /* era #FDE68A */

  --roxo-600: #6941C6;
  --roxo-100: #F1EDFB;
  --ciano-600:#0E7090;
  --ciano-100:#E6F4F8;

  --radius-sm: 8px;
  --radius-md: 10px;
  --radius-lg: 12px;
  --shadow-card:  none;
  --shadow-slide: none;
}

/* ── 65.2 · ESCALA TIPOGRÁFICA PROPORCIONAL ───────────────────────────────────
   Uma base fluida; todos os degraus derivados dela por multiplicador fixo
   (razão 1,20). Nenhum papel pode mais ficar "pequeno demais ao lado de um
   card enorme": os dois vêm do mesmo número. `cqi` = 1% da largura do .slide,
   que já é `container-type: inline-size`. */
.canvas-bloco-wrap .slide:not(#cvx) {
  --cv-fs-base: clamp(15px, 0.82cqi + 8px, 21px);
}
.canvas-bloco-wrap:not(#cvx) {
  --cv-fs-micro:    calc(var(--cv-fs-base, 16px) * 0.72);
  --cv-fs-caption:  calc(var(--cv-fs-base, 16px) * 0.80);
  --cv-fs-small:    calc(var(--cv-fs-base, 16px) * 0.88);
  --cv-fs-body:     var(--cv-fs-base, 16px);
  --cv-fs-subtitle: calc(var(--cv-fs-base, 16px) * 1.14);
  --cv-fs-title:    calc(var(--cv-fs-base, 16px) * 1.32);
  --cv-fs-display:  calc(var(--cv-fs-base, 16px) * 1.70);
  --cv-fs-hero:     calc(var(--cv-fs-base, 16px) * 2.15);

  --cv-gap:      clamp(14px, 1.1cqi + 6px, 26px);
  --cv-pad-card: clamp(14px, 0.9cqi + 7px, 24px);
  --cv-pad-palco: clamp(22px, 1.6cqi + 8px, 52px);
  --cv-line-height: 1.5;
}
:root { --cv-fs-base: 16px; }

/* ── 65.3 · A FAIXA — FLUIDA COM TETO (fim do estica-tudo em ultrawide) ──────
   Teto duplo: o valor salvo pelo editor NUNCA passa de --cv-lousa-teto. Isso
   neutraliza qualquer preferência antiga gravada no Drive com 2000/2400px sem
   tirar o controle do usuário abaixo do teto.
   `min()` com 3 termos: (a) o que o editor pediu, (b) o teto físico de leitura,
   (c) o que a tela oferece menos a margem obrigatória. */
.canvas-bloco-wrap:not(#cvx) {
  --cv-lousa-teto: 1720px;
  --cv-lousa-fluida: max(1120px, 76vw);
}
.canvas-bloco-wrap:not(#cvx) .s-body {
  width: 100% !important;
  max-width: min(
      var(--cv-body-max, var(--cv-lousa-fluida)),
      var(--cv-lousa-teto),
      calc(100% - 2 * var(--cv-margem-min, 18px))
  ) !important;
  margin-left: var(--cvx-body-ml, auto) !important;
  margin-right: var(--cvx-body-mr, auto) !important;
}
/* T14 (mapa mental) e T15/T17 de palco aberto usam a tela inteira por desenho. */
.canvas-bloco-wrap[data-mapa="1"]:not(#cvx) .s-body,
.canvas-bloco-wrap[data-tpl="T14"]:not(#cvx) .s-body {
  max-width: calc(100% - 2 * var(--cv-margem-min, 18px)) !important;
}

/* ── 65.4 · SUPERFÍCIES FLAT — sem sombra, sem gradiente, borda de 1px ─────── */
.canvas-bloco-wrap:not(#cvx) .card,
.canvas-bloco-wrap:not(#cvx) .a-card,
.canvas-bloco-wrap:not(#cvx) .mono-box,
.canvas-bloco-wrap:not(#cvx) [class*="-card"],
.canvas-bloco-wrap:not(#cvx) [class*="-box"],
.canvas-bloco-wrap:not(#cvx) [class*="-panel"],
.canvas-bloco-wrap:not(#cvx) .pyramid,
.canvas-bloco-wrap:not(#cvx) .exec-table {
  box-shadow: none !important;
  background-image: none !important;
  border-radius: var(--cv-radius-card, var(--radius-md)) !important;
  border-color: var(--border) !important;
}
/* A cor do papel entra como FAIXA sólida, não como fundo chapado colorido. */
.canvas-bloco-wrap:not(#cvx) .a-card {
  background: var(--bg-panel) !important;
  border: 1px solid var(--border) !important;
  border-left-width: 3px !important;
}
.canvas-bloco-wrap:not(#cvx) .a-card.blue  { border-left-color: var(--blue-700) !important; }
.canvas-bloco-wrap:not(#cvx) .a-card.amber { border-left-color: var(--amber-600) !important; }
.canvas-bloco-wrap:not(#cvx) .a-card.red   { border-left-color: var(--red-600) !important; }
.canvas-bloco-wrap:not(#cvx) .a-card.dark  { border-left-color: var(--navy) !important; }

/* Cabeçalhos de card: fundo de 8%, texto na tinta cheia — contraste real. */
.canvas-bloco-wrap:not(#cvx) .crime-card-hdr.blue,
.canvas-bloco-wrap:not(#cvx) .vs-card-hdr.blue   { background: var(--blue-100) !important;  color: var(--blue-700) !important; }
.canvas-bloco-wrap:not(#cvx) .crime-card-hdr.amber,
.canvas-bloco-wrap:not(#cvx) .vs-card-hdr.amber  { background: var(--amber-100) !important; color: var(--amber-600) !important; }
.canvas-bloco-wrap:not(#cvx) .crime-card-hdr.red,
.canvas-bloco-wrap:not(#cvx) .vs-card-hdr.red    { background: var(--red-100) !important;   color: var(--red-600) !important; }
.canvas-bloco-wrap:not(#cvx) .crime-card-hdr.green,
.canvas-bloco-wrap:not(#cvx) .vs-card-hdr.green  { background: var(--green-100) !important; color: var(--green-600) !important; }

/* Pills e badges: sem cápsula pastel gritante. */
.canvas-bloco-wrap:not(#cvx) .pill {
  border-radius: 6px !important;
  padding: 3px 9px !important;
  font-weight: 700 !important;
  letter-spacing: .4px !important;
  border: 1px solid transparent !important;
  white-space: nowrap !important;
  max-width: none !important;
  text-overflow: clip !important;
  overflow: visible !important;
}
.canvas-bloco-wrap:not(#cvx) .pill.blue  { background: var(--blue-100)  !important; color: var(--blue-700)  !important; border-color: #D4E2FD !important; }
.canvas-bloco-wrap:not(#cvx) .pill.green { background: var(--green-100) !important; color: var(--green-600) !important; border-color: #CFEDDF !important; }
.canvas-bloco-wrap:not(#cvx) .pill.red   { background: var(--red-100)   !important; color: var(--red-600)   !important; border-color: #FADCD8 !important; }
.canvas-bloco-wrap:not(#cvx) .pill.amber { background: var(--amber-100) !important; color: var(--amber-600) !important; border-color: #F7E3CC !important; }
.canvas-bloco-wrap:not(#cvx) .pill.dark  { background: #F2F4F7          !important; color: var(--text-900)  !important; border-color: var(--border) !important; }

/* Rótulo nunca truncado (a queixa de "ANTISSIMÉTRICA" cortada). */
.canvas-bloco-wrap:not(#cvx) .risk-leg-badge,
.canvas-bloco-wrap:not(#cvx) [class*="-badge"],
.canvas-bloco-wrap:not(#cvx) [class*="-tag"] {
  width: auto !important;
  min-width: 0 !important;
  max-width: none !important;
  white-space: nowrap !important;
  overflow: visible !important;
  text-overflow: clip !important;
}

/* ── 65.5 · SIMETRIA E FIM DOS BURACOS ────────────────────────────────────────
   Regra geral: contêiner que tem altura total distribui a altura entre os
   filhos, em vez de empilhar tudo no meio e sobrar rodapé vazio. */
.canvas-bloco-wrap:not(#cvx) .s-body > * { margin: 0 !important; }
.canvas-bloco-wrap:not(#cvx) .s-body {
  gap: var(--cv-gap) !important;
  align-content: stretch !important;
}
.canvas-bloco-wrap:not(#cvx) [class*="-grid"] {
  align-items: stretch !important;
  align-content: stretch !important;
  gap: var(--cv-gap) !important;
}
.canvas-bloco-wrap:not(#cvx) [class*="-grid"] > * { height: auto !important; }
.canvas-bloco-wrap:not(#cvx) [class*="-stack"],
.canvas-bloco-wrap:not(#cvx) [class*="-col"] {
  gap: var(--cv-gap) !important;
  justify-content: flex-start !important;
}

/* PIRÂMIDE T08 — a queixa do "outdoor": degraus com altura de conteúdo dentro
   de contêiner de altura total + justify-content:center = tudo espremido no
   meio e metade do card vazia. Os degraus passam a dividir a altura. */
.canvas-bloco-wrap:not(#cvx) .pyramid {
  justify-content: stretch !important;
  gap: var(--cv-pyr-gap, 8px) !important;
  padding: var(--cv-pad-card) !important;
}
.canvas-bloco-wrap:not(#cvx) .pyramid > .pyr-lvl,
.canvas-bloco-wrap:not(#cvx) .pyramid > .pyr-level {
  flex: 1 1 0 !important;
  min-height: 42px !important;
  max-height: 108px !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  padding: 8px var(--cv-pyr-pad-x, 16px) !important;
  border-radius: 6px !important;
  box-shadow: none !important;
  font-size: var(--cv-pyr-fs, var(--cv-fs-small)) !important;
  line-height: 1.25 !important;
}

/* ── 65.6 · FÓRMULA — proporcional, nunca quebrada no meio da prosa ──────────
   `renderMathInElement` embrulha cada \( \) num <span> anônimo. Se o pai é
   flex/grid, o navegador BLOCA esse span: a fórmula ganha linha própria e cada
   pedaço de prosa vira outro item (origem da pontuação órfã e do texto
   picotado). O JS desfaz o flex nesses casos; aqui fica a garantia estática. */
.canvas-bloco-wrap:not(#cvx) .katex { font-size: 1.06em !important; }
.canvas-bloco-wrap:not(#cvx) .katex-display { margin: .35em 0 !important; }
.canvas-bloco-wrap:not(#cvx) [data-cvx-inline="1"] {
  display: block !important;
  flex-direction: initial !important;
}
.canvas-bloco-wrap:not(#cvx) [data-cvx-inline="1"] > * { display: inline !important; }
.canvas-bloco-wrap:not(#cvx) [data-cvx-inline="1"] > br { display: block !important; }

/* Caixa de fórmula: centro real, altura mínima proporcional, sem gap morto. */
.canvas-bloco-wrap:not(#cvx) .mono-box,
.canvas-bloco-wrap:not(#cvx) .eq-math-card,
.canvas-bloco-wrap:not(#cvx) [class*="-formula"] {
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: center !important;
  min-height: calc(var(--cv-fs-base, 16px) * 3.2) !important;
  padding: var(--cv-pad-card) !important;
  background: var(--bg-subtle) !important;
  border: 1px solid var(--border) !important;
}
/* Caixa-alta de rótulo NÃO herda para dentro do KaTeX (COS²Θ virando texto). */
.canvas-bloco-wrap:not(#cvx) .katex,
.canvas-bloco-wrap:not(#cvx) .katex * {
  text-transform: none !important;
  letter-spacing: normal !important;
}

/* ── 65.7 · TABELA EXECUTIVA — cabeçalho que não parte palavra ao meio ────────
   `word-break: keep-all` não vale para alfabeto latino. O que faz o layout
   automático reservar a largura do rótulo inteiro é `white-space: nowrap`. */
.canvas-bloco-wrap:not(#cvx) .exec-table { width: 100% !important; table-layout: auto !important; }
.canvas-bloco-wrap:not(#cvx) .exec-table th {
  white-space: nowrap !important;
  font-size: var(--cv-fs-caption) !important;
  letter-spacing: .6px !important;
  background: var(--navy) !important;
  color: #fff !important;
}
.canvas-bloco-wrap:not(#cvx) .exec-table td { font-size: var(--cv-fs-small) !important; }
.canvas-bloco-wrap:not(#cvx) .exec-table tr + tr td { border-top: 1px solid var(--border-soft) !important; }

/* ── 65.8 · SVG — proporção honesta, nunca tira esticada ─────────────────────
   O gerador escreve width='100%' height='100%' como ATRIBUTO; atributo de
   apresentação tem a menor prioridade e o height é descartado, então a
   proporção do viewBox passa a mandar sozinha e estica a moldura. */
.canvas-bloco-wrap:not(#cvx) svg[width="100%"][height="100%"] {
  width: 100% !important;
  height: 100% !important;
}
.canvas-bloco-wrap:not(#cvx) .eq-svg-box,
.canvas-bloco-wrap:not(#cvx) [class*="-svg"] {
  min-height: 0 !important;
  max-height: none !important;
  padding: var(--cv-pad-card) !important;
}
.canvas-bloco-wrap:not(#cvx) .eq-svg-box > svg,
.canvas-bloco-wrap:not(#cvx) [class*="-svg"] > svg {
  max-height: 100% !important;
  max-width: 100% !important;
}

/* ── 65.9 · MEDIDA DE LEITURA — linha longa demais cansa e desalinha ─────────
   Teto de medida SEM centralização: `margin-inline:auto` aqui descolava o
   parágrafo da borda do card e abria um vazio que parecia recuo. */
.canvas-bloco-wrap:not(#cvx) p,
.canvas-bloco-wrap:not(#cvx) .a-card-desc,
.canvas-bloco-wrap:not(#cvx) .cid-desc,
.canvas-bloco-wrap:not(#cvx) .tl-body {
  max-width: 78ch !important;
  margin-inline: 0 !important;
}

/* ── 65.10 · ESTABILIZAÇÃO — o slide só aparece pronto ────────────────────────
   Enquanto o JS mede e ajusta (KaTeX, viewBox, densidade, escala), o bloco
   fica INVISÍVEL mas COM LAYOUT (visibility, não display) — sem isso as
   medidas dariam zero. A revelação é única, 160ms, sem salto de escala. */
.canvas-bloco-wrap.cvx-estabilizando:not(#cvx) {
  visibility: hidden !important;
  animation: none !important;
  opacity: 0 !important;
  transition: none !important;
}
.canvas-bloco-wrap.cvx-pronto:not(#cvx) {
  visibility: visible !important;
  opacity: 1 !important;
  transform: none !important;
  animation: cvxEntrada .16s ease-out both !important;
}
@keyframes cvxEntrada { from { opacity: 0; } to { opacity: 1; } }

/* ── 65.11 · DENSIDADE — degraus aplicados pelo JS antes de mexer na escala ───
   Ordem correta de reagir ao estouro: primeiro tirar espaço morto, só depois
   escalar. A ordem antiga ia direto à escala e derrubava a fonte do slide
   inteiro (medido: 7,2px no piso). */
.canvas-bloco-wrap[data-cvx-dens="1"]:not(#cvx) {
  --cv-gap: clamp(10px, 0.8cqi + 4px, 18px);
  --cv-pad-card: clamp(11px, 0.7cqi + 5px, 18px);
  --cv-line-height: 1.42;
}
.canvas-bloco-wrap[data-cvx-dens="2"]:not(#cvx) {
  --cv-gap: clamp(8px, 0.6cqi + 3px, 13px);
  --cv-pad-card: clamp(9px, 0.5cqi + 4px, 14px);
  --cv-pad-palco: clamp(14px, 1cqi + 6px, 30px);
  --cv-line-height: 1.34;
}
/* Degrau 3 — SÓ acontece quando sobra largura e falta altura: a pilha de
   coluna única vira duas colunas. É isto que transforma o vazio lateral do
   monitor ultrawide em altura recuperada, em vez de encolher a fonte. */
.canvas-bloco-wrap[data-cvx-dens="3"]:not(#cvx) {
  --cv-gap: clamp(8px, 0.6cqi + 3px, 13px);
  --cv-pad-card: clamp(9px, 0.5cqi + 4px, 14px);
  --cv-pad-palco: clamp(12px, 0.9cqi + 5px, 26px);
  --cv-line-height: 1.32;
}
.canvas-bloco-wrap[data-cvx-dens="3"]:not(#cvx) [data-cvx-2col="1"] {
  display: grid !important;
  grid-template-columns: 1fr 1fr !important;
  align-items: start !important;
  gap: var(--cv-gap) !important;
}

/* ── 65.12 · TETO DO ZOOM TIPOGRÁFICO ────────────────────────────────────────
   O zoom automático chegava a 1,60x em uns blocos e 1,00x em outros da MESMA
   lousa — a desproporção entre slides que ele apontou. O JS agora usa teto
   1,12x; esta regra é a trava final para lousas salvas antes do patch. */
.canvas-bloco-wrap:not(#cvx) .s-body[style*="--cvx-zoom-txt"] {
  --cv-fs-base: clamp(15px, calc((0.82cqi + 8px) * min(var(--cvx-zoom-txt, 1), 1.12)), 23px);
}


/* ══════════════════════════════════════════════════════════════════════════
   V65b — A CAUSA REAL DA "FONTE MINÚSCULA": px CRAVADO NO style DO GERADOR
   ──────────────────────────────────────────────────────────────────────────
   Medição na lousa real (19 blocos): 110 declarações `font-size:NNpx` inline,
   todas entre 10px e 16px, escritas pelos próprios templates do Canvas.gs.
   Estilo inline vence qualquer regra de classe — então a escala tipográfica
   inteira (tokens --cv-fs-*) era simplesmente ignorada nesses 110 pontos.
   Era por isso que um card enorme aparecia com legenda de 10px do lado de um
   texto de 16px: não havia hierarquia, havia números soltos.
   Regra de classe COM !important vence estilo inline SEM !important — é o que
   esta seção usa para remapear cada valor cravado ao degrau correspondente da
   escala. O Canvas.gs foi corrigido na mesma entrega para não gerar mais px;
   isto aqui é a rede para as lousas JÁ SALVAS.
   ══════════════════════════════════════════════════════════════════════════ */
.canvas-bloco-wrap [style*="font-size:9px"],  .canvas-bloco-wrap [style*="font-size: 9px"],
.canvas-bloco-wrap [style*="font-size:10px"], .canvas-bloco-wrap [style*="font-size: 10px"]
  { font-size: var(--cv-fs-micro) !important; }

.canvas-bloco-wrap [style*="font-size:11px"], .canvas-bloco-wrap [style*="font-size: 11px"]
  { font-size: var(--cv-fs-caption) !important; }

.canvas-bloco-wrap [style*="font-size:12px"], .canvas-bloco-wrap [style*="font-size: 12px"],
.canvas-bloco-wrap [style*="font-size:12.5px"],
.canvas-bloco-wrap [style*="font-size:13px"], .canvas-bloco-wrap [style*="font-size: 13px"]
  { font-size: var(--cv-fs-small) !important; }

.canvas-bloco-wrap [style*="font-size:14px"], .canvas-bloco-wrap [style*="font-size: 14px"],
.canvas-bloco-wrap [style*="font-size:15px"], .canvas-bloco-wrap [style*="font-size: 15px"]
  { font-size: var(--cv-fs-body) !important; }

.canvas-bloco-wrap [style*="font-size:16px"], .canvas-bloco-wrap [style*="font-size: 16px"],
.canvas-bloco-wrap [style*="font-size:17px"], .canvas-bloco-wrap [style*="font-size:18px"]
  { font-size: var(--cv-fs-subtitle) !important; }

.canvas-bloco-wrap [style*="font-size:19px"], .canvas-bloco-wrap [style*="font-size:20px"],
.canvas-bloco-wrap [style*="font-size:21px"], .canvas-bloco-wrap [style*="font-size:22px"]
  { font-size: var(--cv-fs-title) !important; }

.canvas-bloco-wrap [style*="font-size:24px"], .canvas-bloco-wrap [style*="font-size:26px"],
.canvas-bloco-wrap [style*="font-size:28px"], .canvas-bloco-wrap [style*="font-size:30px"]
  { font-size: var(--cv-fs-display) !important; }

.canvas-bloco-wrap [style*="font-size:32px"], .canvas-bloco-wrap [style*="font-size:34px"],
.canvas-bloco-wrap [style*="font-size:36px"], .canvas-bloco-wrap [style*="font-size:38px"],
.canvas-bloco-wrap [style*="font-size:40px"]
  { font-size: var(--cv-fs-hero) !important; }

/* O SVG tem escala própria (unidades de viewBox, não px de tela) — remapear
   font-size lá dentro deformaria o desenho. Fica de fora. */
.canvas-bloco-wrap svg [style*="font-size"],
.canvas-bloco-wrap svg text,
.canvas-bloco-wrap svg tspan { font-size: revert !important; }

/* ── 65b.2 · DUAS COLUNAS PARA PILHAS LONGAS (degrau 3 da densidade) ─────────
   Além das pilhas genéricas, os contêineres nomeados que mais estouram na
   medição: timeline (T11, o pior de todos: 630px de excesso), grade de
   tipologias (T04) e lista de passos (T17). */
.canvas-bloco-wrap[data-cvx-dens="3"]:not(#cvx) .timeline[data-cvx-2col="1"],
.canvas-bloco-wrap[data-cvx-dens="3"]:not(#cvx) .eq-step-col[data-cvx-2col="1"],
.canvas-bloco-wrap[data-cvx-dens="3"]:not(#cvx) .crime-stack[data-cvx-2col="1"] {
  display: grid !important;
  grid-template-columns: 1fr 1fr !important;
  align-items: start !important;
  gap: var(--cv-gap) !important;
}
/* Grades que se declaram com N colunas fixas ganham uma coluna a mais quando
   há folga lateral — usa o espaço do monitor largo em vez de encolher letra. */
.canvas-bloco-wrap[data-cvx-dens="3"]:not(#cvx) .cid-grid,
.canvas-bloco-wrap[data-cvx-dens="3"]:not(#cvx) .kpi-grid {
  grid-template-columns: repeat(auto-fit, minmax(var(--cv-col-min, 260px), 1fr)) !important;
}

/* ── 65b.3 · T08 — a queixa da "pirâmide do Egito ao lado da torre de babel" ──
   Duas colunas de peso visual igual disputavam a atenção. A pirâmide é o
   diagrama (peso menor, largura menor) e o card de regras é o conteúdo. */
.canvas-bloco-wrap:not(#cvx) .kelsen-grid {
  display: grid !important;
  grid-template-columns: minmax(280px, 0.85fr) minmax(0, 1.6fr) !important;
  align-items: stretch !important;
  gap: var(--cv-gap) !important;
}
.canvas-bloco-wrap:not(#cvx) .kelsen-grid > .card {
  justify-content: flex-start !important;
  gap: calc(var(--cv-gap) * 0.55) !important;
}


/* ── 65b.4 · TIMELINE (T11) EM DUAS COLUNAS ──────────────────────────────────
   O T11 é o pior caso medido de estouro (630px em ultrawide, 771px em
   notebook). Em duas colunas o trilho vertical `::before` ficaria só na
   coluna da esquerda e os marcadores (`left:-46px`) cairiam fora da segunda.
   Por isso, no modo dividido, o trilho sai e o marcador vira selo dentro do
   próprio item — que é como um livro didático apresenta fases em duas colunas. */
.canvas-bloco-wrap[data-cvx-dens="3"]:not(#cvx) .timeline[data-cvx-2col="1"] {
  padding-left: 0 !important;
}
.canvas-bloco-wrap[data-cvx-dens="3"]:not(#cvx) .timeline[data-cvx-2col="1"]::before {
  display: none !important;
}
.canvas-bloco-wrap[data-cvx-dens="3"]:not(#cvx) .timeline[data-cvx-2col="1"] .tl-item {
  padding-left: calc(var(--cv-pad-card) + var(--cv-tl-dot, 30px)) !important;
}
.canvas-bloco-wrap[data-cvx-dens="3"]:not(#cvx) .timeline[data-cvx-2col="1"] .tl-dot {
  left: var(--cv-pad-card) !important;
  top: var(--cv-pad-card) !important;
  border-width: 0 !important;
}

/* ══════════════════════════════════════════════════════════════════════════
   CAMADA VISUAL v70 — IDENTIDADE FLAT MODERNA
   Só cor, forma, ícone, alinhamento e ritmo tipográfico. Nenhuma estrutura de
   template foi alterada: as mesmas classes, os mesmos blocos, o mesmo HTML.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── 70.1 · PALETA VIVA (tinta cheia, fundo de 10%) ───────────────────────── */
.canvas-bloco-wrap {
  --bg-page:     #FFFFFF;
  --bg-panel:    #FFFFFF;
  --bg-subtle:   #F5F7FA;
  --border:      #E6EAF0;
  --border-soft: #F1F4F8;

  --text-900: #16202E;
  --text-600: #566274;
  --text-400: #8A94A6;
  --navy:     #1B2836;

  --blue-700: #1F6FEB;
  --blue-500: #3B8AFF;
  --blue-100: #E8F1FF;
  --green-600:#22A45D;
  --green-100:#E6F7EE;
  --amber-600:#F2A33C;
  --amber-100:#FFF4E3;
  --red-600:  #EB5757;
  --red-100:  #FDEDED;
  --roxo-600: #7C5CE6;
  --roxo-100: #F1EDFD;
  --ciano-600:#17A2B8;
  --ciano-100:#E4F6F9;

  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 18px;
  --shadow-card:  0 2px 10px rgba(22, 32, 46, .06);
  --shadow-slide: 0 4px 22px rgba(22, 32, 46, .07);
}

/* ── 70.2 · CARTÕES: branco, canto macio, sombra leve ─────────────────────── */
.canvas-bloco-wrap:not(#cvx) .card,
.canvas-bloco-wrap:not(#cvx) .vs-card,
.canvas-bloco-wrap:not(#cvx) .cid-card,
.canvas-bloco-wrap:not(#cvx) .kpi-card,
.canvas-bloco-wrap:not(#cvx) .crime-card,
.canvas-bloco-wrap:not(#cvx) .eq-step-card,
.canvas-bloco-wrap:not(#cvx) .a-card,
.canvas-bloco-wrap:not(#cvx) .tl-item {
  background: var(--bg-panel) !important;
  border: 1px solid var(--border) !important;
  border-radius: var(--radius-md) !important;
  box-shadow: var(--shadow-card) !important;
}
.canvas-bloco-wrap:not(#cvx) .a-card { border-left-width: 4px !important; }
.canvas-bloco-wrap:not(#cvx) .a-card.blue   { border-left-color: var(--blue-700) !important; }
.canvas-bloco-wrap:not(#cvx) .a-card.green  { border-left-color: var(--green-600) !important; }
.canvas-bloco-wrap:not(#cvx) .a-card.amber  { border-left-color: var(--amber-600) !important; }
.canvas-bloco-wrap:not(#cvx) .a-card.red    { border-left-color: var(--red-600) !important; }
.canvas-bloco-wrap:not(#cvx) .a-card.dark   { border-left-color: var(--navy) !important; }

/* ── 70.3 · TÍTULO DA SEÇÃO: centralizado, com fio de destaque ────────────── */
.canvas-bloco-wrap:not(#cvx) .sec-title {
  text-align: center !important;
  justify-content: center !important;
  font-weight: 800 !important;
  letter-spacing: -.01em !important;
  color: var(--text-900) !important;
  padding-bottom: 10px !important;
  margin-bottom: calc(var(--cv-gap) * .9) !important;
  position: relative;
}
.canvas-bloco-wrap:not(#cvx) .sec-title::after {
  content: '';
  position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
  width: 54px; height: 3px; border-radius: 99px;
  background: linear-gradient(90deg, var(--blue-700), var(--green-600));
}
.canvas-bloco-wrap:not(#cvx) .sec-title i { color: var(--blue-700) !important; }

/* ── 70.4 · ÍCONES EM SELO CIRCULAR (referência flat) ─────────────────────── */
.canvas-bloco-wrap:not(#cvx) .cid-icon-wrap,
.canvas-bloco-wrap:not(#cvx) .eq-param-icon,
.canvas-bloco-wrap:not(#cvx) .crime-card-hdr-icon {
  border-radius: 50% !important;
  width: 46px !important; height: 46px !important;
  display: flex !important; align-items: center !important; justify-content: center !important;
  box-shadow: 0 4px 12px rgba(22, 32, 46, .12) !important;
  color: #fff !important;
  flex-shrink: 0 !important;
}
.canvas-bloco-wrap:not(#cvx) .cid-icon-wrap i,
.canvas-bloco-wrap:not(#cvx) .eq-param-icon i,
.canvas-bloco-wrap:not(#cvx) .crime-card-hdr-icon i { color: #fff !important; font-size: 18px !important; }
.canvas-bloco-wrap:not(#cvx) .eq-param-icon.blue,
.canvas-bloco-wrap:not(#cvx) .crime-card-hdr.blue .crime-card-hdr-icon { background: var(--blue-700) !important; }
.canvas-bloco-wrap:not(#cvx) .eq-param-icon.green { background: var(--green-600) !important; }
.canvas-bloco-wrap:not(#cvx) .eq-param-icon.red   { background: var(--red-600) !important; }
.canvas-bloco-wrap:not(#cvx) .eq-param-icon.amber { background: var(--amber-600) !important; }

/* ── 70.5 · CABEÇALHO COLORIDO DOS CARTÕES DE COMPARAÇÃO ─────────────────── */
.canvas-bloco-wrap:not(#cvx) .vs-card-hdr {
  border-radius: var(--radius-md) var(--radius-md) 0 0 !important;
  padding: 14px 18px !important;
  border-bottom: 1px solid var(--border-soft) !important;
}
.canvas-bloco-wrap:not(#cvx) .vs-card-hdr.blue  { background: var(--blue-100) !important; }
.canvas-bloco-wrap:not(#cvx) .vs-card-hdr.green { background: var(--green-100) !important; }
.canvas-bloco-wrap:not(#cvx) .vs-card-hdr.amber { background: var(--amber-100) !important; }
.canvas-bloco-wrap:not(#cvx) .vs-card-hdr.red   { background: var(--red-100) !important; }
.canvas-bloco-wrap:not(#cvx) .vs-card-hdr h2    { font-weight: 800 !important; letter-spacing: .01em !important; }

/* ── 70.6 · SELOS (pills) ARREDONDADOS ───────────────────────────────────── */
.canvas-bloco-wrap:not(#cvx) .pill {
  border-radius: 999px !important;
  padding: 4px 12px !important;
  font-weight: 700 !important;
  border: none !important;
}
.canvas-bloco-wrap:not(#cvx) .pill.blue  { background: var(--blue-100) !important;  color: var(--blue-700) !important; }
.canvas-bloco-wrap:not(#cvx) .pill.green { background: var(--green-100) !important; color: var(--green-600) !important; }
.canvas-bloco-wrap:not(#cvx) .pill.amber { background: var(--amber-100) !important; color: #B3701A !important; }
.canvas-bloco-wrap:not(#cvx) .pill.red   { background: var(--red-100) !important;   color: var(--red-600) !important; }
.canvas-bloco-wrap:not(#cvx) .pill.dark  { background: #EEF1F5 !important;          color: var(--navy) !important; }

/* ── 70.7 · TABELA EXECUTIVA ─────────────────────────────────────────────── */
.canvas-bloco-wrap:not(#cvx) .exec-table {
  border-radius: var(--radius-md) !important;
  overflow: hidden !important;
  border: 1px solid var(--border) !important;
  box-shadow: var(--shadow-card) !important;
  border-collapse: separate !important;
  border-spacing: 0 !important;
}
.canvas-bloco-wrap:not(#cvx) .exec-table thead th {
  background: var(--navy) !important;
  color: #fff !important;
  font-weight: 800 !important;
  letter-spacing: .04em !important;
  text-transform: uppercase !important;
  border: none !important;
}
.canvas-bloco-wrap:not(#cvx) .exec-table tbody tr:nth-child(even) { background: var(--bg-subtle) !important; }
.canvas-bloco-wrap:not(#cvx) .exec-table td { border-top: 1px solid var(--border-soft) !important; }

/* ── 70.8 · LINHA DO TEMPO COM MARCADOR CIRCULAR ─────────────────────────── */
.canvas-bloco-wrap:not(#cvx) .tl-dot {
  border-radius: 50% !important;
  width: 34px !important; height: 34px !important;
  display: flex !important; align-items: center !important; justify-content: center !important;
  color: #fff !important; font-weight: 800 !important;
  border: 3px solid #fff !important;
  box-shadow: 0 3px 10px rgba(22, 32, 46, .16) !important;
}
.canvas-bloco-wrap:not(#cvx) .timeline::before { background: var(--border) !important; width: 2px !important; }

/* ── 70.9 · INDICADORES (KPI) ────────────────────────────────────────────── */
.canvas-bloco-wrap:not(#cvx) .kpi-card { text-align: center !important; }
.canvas-bloco-wrap:not(#cvx) .kpi-val {
  font-weight: 800 !important;
  color: var(--blue-700) !important;
  letter-spacing: -.02em !important;
}
.canvas-bloco-wrap:not(#cvx) .kpi-lbl { font-weight: 700 !important; color: var(--text-900) !important; }
.canvas-bloco-wrap:not(#cvx) .kpi-note { color: var(--text-600) !important; }

/* ── 70.10 · MATRIZ DE RISCO E PIRÂMIDE ──────────────────────────────────── */
.canvas-bloco-wrap:not(#cvx) .risk-cell,
.canvas-bloco-wrap:not(#cvx) .risk-matrix-hdr {
  border-radius: var(--radius-sm) !important;
  font-weight: 700 !important;
  padding: 12px 10px !important;
  display: flex !important; align-items: center !important; justify-content: center !important;
  text-align: center !important;
}
.canvas-bloco-wrap:not(#cvx) .risk-cell.red   { background: var(--red-100) !important;   color: var(--red-600) !important; }
.canvas-bloco-wrap:not(#cvx) .risk-cell.amber { background: var(--amber-100) !important; color: #B3701A !important; }
.canvas-bloco-wrap:not(#cvx) .risk-cell.green { background: var(--green-100) !important; color: var(--green-600) !important; }
.canvas-bloco-wrap:not(#cvx) .risk-leg-badge  { border-radius: 999px !important; font-weight: 800 !important; }
.canvas-bloco-wrap:not(#cvx) .pyr-lvl {
  border-radius: var(--radius-sm) !important;
  color: #fff !important; font-weight: 800 !important;
  box-shadow: 0 2px 8px rgba(22, 32, 46, .12) !important;
}

/* ── 70.11 · MAPA MENTAL ─────────────────────────────────────────────────── */
.canvas-bloco-wrap:not(#cvx) .mm-root,
.canvas-bloco-wrap:not(#cvx) .mm-branch {
  border-radius: 999px !important;
  font-weight: 800 !important;
  box-shadow: 0 3px 12px rgba(22, 32, 46, .12) !important;
}
.canvas-bloco-wrap:not(#cvx) .mm-mid,
.canvas-bloco-wrap:not(#cvx) .mm-sub { border-radius: var(--radius-sm) !important; }

/* ── 70.12 · CLASSES UTILITÁRIAS (substituem estilo inline do gerador) ───── */
.canvas-bloco-wrap:not(#cvx) .t-blue  { color: var(--blue-700) !important; }
.canvas-bloco-wrap:not(#cvx) .t-green { color: var(--green-600) !important; }
.canvas-bloco-wrap:not(#cvx) .t-amber { color: var(--amber-600) !important; }
.canvas-bloco-wrap:not(#cvx) .t-red   { color: var(--red-600) !important; }
.canvas-bloco-wrap:not(#cvx) .t-navy  { color: var(--navy) !important; }
.canvas-bloco-wrap:not(#cvx) .t-dark  { color: var(--text-900) !important; }
.canvas-bloco-wrap:not(#cvx) .t-muted { color: var(--text-600) !important; }
.canvas-bloco-wrap:not(#cvx) .t-soft  { color: var(--text-400) !important; }
.canvas-bloco-wrap:not(#cvx) .t-roxo  { color: var(--roxo-600) !important; }

.canvas-bloco-wrap:not(#cvx) .fs-micro    { font-size: var(--cv-fs-micro); }
.canvas-bloco-wrap:not(#cvx) .fs-caption  { font-size: var(--cv-fs-caption); }
.canvas-bloco-wrap:not(#cvx) .fs-small    { font-size: var(--cv-fs-small); }
.canvas-bloco-wrap:not(#cvx) .fs-body     { font-size: var(--cv-fs-body); }
.canvas-bloco-wrap:not(#cvx) .fs-subtitle { font-size: var(--cv-fs-subtitle); }
.canvas-bloco-wrap:not(#cvx) .fs-title    { font-size: var(--cv-fs-title); }
.canvas-bloco-wrap:not(#cvx) .fs-display  { font-size: var(--cv-fs-display); }
.canvas-bloco-wrap:not(#cvx) .fs-hero     { font-size: var(--cv-fs-hero); }
.canvas-bloco-wrap:not(#cvx) .fw-bold     { font-weight: 700; }
.canvas-bloco-wrap:not(#cvx) .fw-black    { font-weight: 800; }
.canvas-bloco-wrap:not(#cvx) .rotulo {
  font-family: 'Baloo 2', sans-serif;
  font-size: var(--cv-fs-micro);
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--blue-700);
  display: block;
  margin-bottom: 8px;
}

/* ── 70.13 · PARÁGRAFO COM FÓRMULA NUNCA QUEBRA ──────────────────────────────
   O KaTeX embrulha cada \( \) num <span>; se o contêiner for flex/grid, o
   navegador transforma esse span em bloco e a fórmula ganha linha própria,
   partindo a frase. Estes contêineres voltam a ser fluxo normal de texto. */
.canvas-bloco-wrap:not(#cvx) .cid-desc,
.canvas-bloco-wrap:not(#cvx) .vs-item-txt,
.canvas-bloco-wrap:not(#cvx) .a-card-desc,
.canvas-bloco-wrap:not(#cvx) .tl-desc {
  display: block !important;
  text-align: left !important;
}
.canvas-bloco-wrap:not(#cvx) .katex { display: inline-block !important; vertical-align: baseline !important; }

/* ── 70.14 · RÓTULOS INTERNOS EM CAIXA-ALTA NUNCA VAZAM PARA A FÓRMULA ───── */
.canvas-bloco-wrap:not(#cvx) .cid-item-label,
.canvas-bloco-wrap:not(#cvx) .vs-item-label,
.canvas-bloco-wrap:not(#cvx) .a-card-label { letter-spacing: .10em !important; font-weight: 800 !important; }
.canvas-bloco-wrap:not(#cvx) .katex,
.canvas-bloco-wrap:not(#cvx) .katex * { text-transform: none !important; }
.canvas-bloco-wrap:not(#cvx) .t-branco { color: #FFFFFF !important; }

/* ══════════════════════════════════════════════════════════════════════════
   CAMADA v71 — LEGIBILIDADE: COR VIVA NA FORMA, COR TINTA NO TEXTO
   As cores vivas da referência funcionam em ícone, barra e preenchimento,
   mas reprovam em contraste quando viram TEXTO sobre branco (âmbar vivo dá
   2,08:1, verde vivo 3,21:1 — o mínimo legível é 4,5:1). Cada família passa
   a ter duas tintas: a viva (forma) e a escura (texto), medidas em WCAG.
   ══════════════════════════════════════════════════════════════════════════ */
.canvas-bloco-wrap {
  --blue-ink:  #1552C9;   /* 6,81:1 */
  --green-ink: #0F7A43;   /* 5,41:1 */
  --amber-ink: #8A5300;   /* 6,33:1 */
  --red-ink:   #C0362F;   /* 5,51:1 */
  --roxo-ink:  #5B3FD1;   /* 6,83:1 */
  --ciano-ink: #0E6E80;   /* 5,90:1 */
  --text-400:  #6B7688;   /* era #8A94A6 (3,06:1) → 4,72:1 */
}

/* Texto colorido usa sempre a tinta escura */
.canvas-bloco-wrap:not(#cvx) .t-blue  { color: var(--blue-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .t-green { color: var(--green-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .t-amber { color: var(--amber-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .t-red   { color: var(--red-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .t-roxo  { color: var(--roxo-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .rotulo  { color: var(--blue-ink) !important; }

/* Rótulos e títulos internos dos cartões */
.canvas-bloco-wrap:not(#cvx) .cid-item-label,
.canvas-bloco-wrap:not(#cvx) .vs-item-label,
.canvas-bloco-wrap:not(#cvx) .a-card-label,
.canvas-bloco-wrap:not(#cvx) .eq-f-label,
.canvas-bloco-wrap:not(#cvx) .sec-title { color: var(--text-900) !important; }
.canvas-bloco-wrap:not(#cvx) .a-card.blue  .a-card-label { color: var(--blue-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .a-card.green .a-card-label { color: var(--green-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .a-card.amber .a-card-label { color: var(--amber-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .a-card.red   .a-card-label { color: var(--red-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .vs-card-hdr.blue  h2 { color: var(--blue-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .vs-card-hdr.green h2 { color: var(--green-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .vs-card-hdr.amber h2 { color: var(--amber-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .vs-card-hdr.red   h2 { color: var(--red-ink) !important; }

/* Selos e células: fundo claro + tinta escura */
.canvas-bloco-wrap:not(#cvx) .pill.blue,
.canvas-bloco-wrap:not(#cvx) .risk-cell.blue  { color: var(--blue-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .pill.green,
.canvas-bloco-wrap:not(#cvx) .risk-cell.green { color: var(--green-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .pill.amber,
.canvas-bloco-wrap:not(#cvx) .risk-cell.amber { color: var(--amber-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .pill.red,
.canvas-bloco-wrap:not(#cvx) .risk-cell.red   { color: var(--red-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .risk-leg-badge.amber { background: var(--amber-100) !important; color: var(--amber-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .risk-leg-badge.green { background: var(--green-100) !important; color: var(--green-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .risk-leg-badge.red   { background: var(--red-100) !important;   color: var(--red-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .kpi-val { color: var(--blue-ink) !important; }

/* Selo circular de ícone: fundo na tinta escura, ícone branco (4,5:1 garantido) */
.canvas-bloco-wrap:not(#cvx) .eq-param-icon.blue,
.canvas-bloco-wrap:not(#cvx) .crime-card-hdr.blue .crime-card-hdr-icon { background: var(--blue-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .eq-param-icon.green { background: var(--green-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .eq-param-icon.amber { background: var(--amber-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .eq-param-icon.red   { background: var(--red-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .tl-dot.blue  { background: var(--blue-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .tl-dot.green { background: var(--green-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .tl-dot.amber { background: var(--amber-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .tl-dot.red   { background: var(--red-ink) !important; }

/* ── 71.5 · FECHAMENTO DE CONTRASTE: tokens legados e superfícies coloridas ── */
.canvas-bloco-wrap {
  --accent:    #0F62D0;   /* era #0080FF (3,8:1 em texto) → 5,71:1 */
  --text-400:  #5F6B7A;   /* 5,43:1 no branco e 5,06:1 no cinza claro */
  --blue-500:  #2563EB;   /* usado como fundo de selo: branco por cima = 5,17:1 */
  --green-600: #0F7A43;
  --amber-600: #8A5300;
}
/* Texto sobre superfície de 8%: usa sempre a tinta escura da família */
.canvas-bloco-wrap:not(#cvx) [style*="rgba(4, 94, 185"] strong,
.canvas-bloco-wrap:not(#cvx) [style*="rgba(4,94,185"] strong,
.canvas-bloco-wrap:not(#cvx) .destaque-box strong,
.canvas-bloco-wrap:not(#cvx) strong { color: inherit !important; }
.canvas-bloco-wrap:not(#cvx) h1, .canvas-bloco-wrap:not(#cvx) h2,
.canvas-bloco-wrap:not(#cvx) h3, .canvas-bloco-wrap:not(#cvx) h4 { color: var(--text-900); }
/* Selo circular sem classe de cor cai no azul tinta */
.canvas-bloco-wrap:not(#cvx) .tl-dot:not(.blue):not(.green):not(.amber):not(.red) { background: var(--blue-ink) !important; }
/* Texto branco só existe sobre fundo escuro o bastante */
.canvas-bloco-wrap:not(#cvx) .pill.branco,
.canvas-bloco-wrap:not(#cvx) [style*="color:#fff"],
.canvas-bloco-wrap:not(#cvx) .t-branco { text-shadow: none !important; }

/* ── 71.6 · TEMAS DO MAPA MENTAL COM TEXTO BRANCO LEGÍVEL ────────────────────
   Os ramos escrevem em branco sobre --theme. Verde #059669 dava 3,77:1 e
   âmbar #D97706 dava 3,19:1. As tintas abaixo passam de 4,5:1 mantendo a
   mesma família de cor. */
.canvas-bloco-wrap .color-1 { --theme: #1552C9; --theme-line: rgba(21, 82, 201, .7);  --theme-bg: #EEF4FF; }
.canvas-bloco-wrap .color-2 { --theme: #0F7A43; --theme-line: rgba(15, 122, 67, .7);  --theme-bg: #E9F7EF; }
.canvas-bloco-wrap .color-3 { --theme: #8A5300; --theme-line: rgba(138, 83, 0, .7);   --theme-bg: #FDF4E7; }
.canvas-bloco-wrap .color-4 { --theme: #5B3FD1; --theme-line: rgba(91, 63, 209, .7);  --theme-bg: #F2EFFC; }
.canvas-bloco-wrap .color-5 { --theme: #0E6E80; --theme-line: rgba(14, 110, 128, .7); --theme-bg: #E7F5F8; }
.canvas-bloco-wrap .color-6 { --theme: #C0362F; --theme-line: rgba(192, 54, 47, .7);  --theme-bg: #FCEDEC; }
.canvas-bloco-wrap .color-7 { --theme: #B04708; --theme-line: rgba(176, 71, 8, .7);   --theme-bg: #FDF1E8; }

/* ── 71.7 · TEXTO DE APOIO DENTRO DE CABEÇALHO COLORIDO ─────────────────────
   Parágrafo em azul vivo sobre o fundo azul de 10% dava 4,07:1. Dentro de
   qualquer superfície tingida, o corpo do texto usa tinta de leitura. */
.canvas-bloco-wrap:not(#cvx) .crime-card-hdr-text p,
.canvas-bloco-wrap:not(#cvx) .vs-card-hdr p,
.canvas-bloco-wrap:not(#cvx) .cid-card-hdr p { color: var(--text-600) !important; }

/* ══════════════════════════════════════════════════════════════════════════
   CAMADA v74 — CONTRASTE MEDIDO SOBRE SUPERFÍCIE TINGIDA
   As tintas da v71 passavam sobre branco, mas o texto costuma cair sobre
   fundo de 8–10% (card colorido, selo, aviso). Medido na lousa real:
   verde 4,49:1, ciano 3,21:1 e cinza de apoio 4,44:1. Os tons abaixo passam
   de 4,5:1 em TODAS as superfícies usadas pelos templates.
   ══════════════════════════════════════════════════════════════════════════ */
.canvas-bloco-wrap {
  --green-ink: #0B6637;   /* 5,87 sobre azul-claro · 5,79 sobre vermelho-claro */
  --ciano-600: #0E6E80;
  --ciano-ink: #0E6E80;
  --text-400:  #54606F;   /* 5,32 sobre tingido · 6,40 no branco */
}
.canvas-bloco-wrap:not(#cvx) .cid-title,
.canvas-bloco-wrap:not(#cvx) .cid-card-title,
.canvas-bloco-wrap:not(#cvx) .pill.ciano,
.canvas-bloco-wrap:not(#cvx) .pill.cyan { color: var(--ciano-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .t-soft,
.canvas-bloco-wrap:not(#cvx) .fs-caption.t-soft { color: var(--text-400) !important; }
/* Qualquer selo herda a tinta de leitura da própria família */
.canvas-bloco-wrap:not(#cvx) .pill { font-weight: 700 !important; }

/* ── 74.2 · REDE PARA LOUSAS JÁ SALVAS COM COR INLINE ────────────────────────
   Lousas geradas antes da regra "sem cor inline" trazem hex cravado no
   atributo style. Estas regras reescrevem só os tons que reprovam em
   contraste, sem tocar no resto. */
.canvas-bloco-wrap:not(#cvx) [style*="#0891B2"],
.canvas-bloco-wrap:not(#cvx) [style*="#0891b2"] { color: var(--ciano-ink) !important; }
.canvas-bloco-wrap:not(#cvx) [style*="#22A45D"],
.canvas-bloco-wrap:not(#cvx) [style*="#059669"] { color: var(--green-ink) !important; }
.canvas-bloco-wrap:not(#cvx) [style*="#F2A33C"],
.canvas-bloco-wrap:not(#cvx) [style*="#D97706"] { color: var(--amber-ink) !important; }
.canvas-bloco-wrap:not(#cvx) [style*="#EB5757"] { color: var(--red-ink) !important; }
.canvas-bloco-wrap:not(#cvx) [style*="#0080FF"],
.canvas-bloco-wrap:not(#cvx) [style*="#0080ff"] { color: var(--accent) !important; }

/* ── 74.3 · ÚLTIMOS DOIS PONTOS MEDIDOS NA LOUSA DE 16 BLOCOS ────────────────
   1) fórmula em azul vivo sobre cinza claro dava 4,32:1;
   2) degrau da pirâmide em azul claro com texto branco dava 2,54:1.        */
.canvas-bloco-wrap:not(#cvx) .mono-box,
.canvas-bloco-wrap:not(#cvx) .mono-box .katex,
.canvas-bloco-wrap:not(#cvx) .eq-f-formula,
.canvas-bloco-wrap:not(#cvx) [data-tex] { color: var(--blue-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .pyr-lvl {
  color: #fff !important;
  text-shadow: none !important;
  background-image: none !important;
}
.canvas-bloco-wrap:not(#cvx) .pyr-lvl:nth-child(1) { background: #1552C9 !important; }
.canvas-bloco-wrap:not(#cvx) .pyr-lvl:nth-child(2) { background: #0B6637 !important; }
.canvas-bloco-wrap:not(#cvx) .pyr-lvl:nth-child(3) { background: #8A5300 !important; }
.canvas-bloco-wrap:not(#cvx) .pyr-lvl:nth-child(4) { background: #C0362F !important; }
.canvas-bloco-wrap:not(#cvx) .pyr-lvl:nth-child(5) { background: #5B3FD1 !important; }
.canvas-bloco-wrap:not(#cvx) .pyr-lvl:nth-child(6) { background: #0E6E80 !important; }
/* SVG nunca ultrapassa a moldura */
.canvas-bloco-wrap:not(#cvx) svg { max-width: 100% !important; }

/* ── 74.4 · COR DE TEXTO VINDA DE VARIÁVEL VIVA NO style INLINE ──────────────
   O gerador ainda escreve color:var(--blue-700) direto no atributo. O tom vivo
   é de forma, não de leitura: qualquer texto que o use passa para a tinta. */
/* Só quando a variável está em COLOR — se estiver em background, o fundo é
   que usa o tom vivo e o texto por cima deve continuar como está. */
.canvas-bloco-wrap:not(#cvx) [style*="color:var(--blue-700)"],
.canvas-bloco-wrap:not(#cvx) [style*="color: var(--blue-700)"],
.canvas-bloco-wrap:not(#cvx) [style*="color:var(--blue-500)"],
.canvas-bloco-wrap:not(#cvx) [style*="color: var(--blue-500)"]  { color: var(--blue-ink) !important; }
.canvas-bloco-wrap:not(#cvx) [style*="color:var(--green-600)"],
.canvas-bloco-wrap:not(#cvx) [style*="color: var(--green-600)"] { color: var(--green-ink) !important; }
.canvas-bloco-wrap:not(#cvx) [style*="color:var(--amber-600)"],
.canvas-bloco-wrap:not(#cvx) [style*="color: var(--amber-600)"] { color: var(--amber-ink) !important; }
.canvas-bloco-wrap:not(#cvx) [style*="color:var(--red-600)"],
.canvas-bloco-wrap:not(#cvx) [style*="color: var(--red-600)"]   { color: var(--red-ink) !important; }
.canvas-bloco-wrap:not(#cvx) .pyr-lvl,
.canvas-bloco-wrap:not(#cvx) .pyr-lvl * { color: #fff !important; }

/* ── 74.5 · SVG DE LARGURA TOTAL NÃO PASSA DA MOLDURA ───────────────────────
   width='100%' height='100%' como ATRIBUTO tem prioridade mínima; a proporção
   do viewBox acabava ditando altura maior que a caixa.
   CORREÇÃO v76: max-height:100% aqui é a regra que de fato manda (mais
   específica e mais tardia que as outras tentativas no arquivo) — e sofre
   do mesmo problema: o pai quase nunca tem altura própria definida (só
   min-height/flex), então 100% vira "none" pela spec do CSS e o SVG cresce
   livre. Medido ao vivo: 864px de altura pra um viewBox de 340×250, estourando
   a página. vh é uma referência real, sempre funciona. */
.canvas-bloco-wrap:not(#cvx) svg[width="100%"][height="100%"] {
  width: 100% !important;
  height: auto !important;
  max-height: min(46vh, 480px) !important;
  display: block;
}

/* ══════════════════════════════════════════════════════════════════════════
   CAMADA v76 — PÁGINA DE LIVRO: LARGURA FIXA, TOPO ANCORADO, MARGEM MÍNIMA
   Três regras que valem para os 17 templates:
   1. a largura útil é SEMPRE a mesma — nada de sanfona horizontal;
   2. a folga de cima e de baixo cai ao mínimo (respiro vertical enxuto);
   3. três larguras de leitura (P/M/G) disponíveis via botão na barra.
   ══════════════════════════════════════════════════════════════════════════ */
.canvas-bloco-wrap {
  --cv-largura-palco: 1180px;     /* largura padrão · o botão P/M/G troca este valor */
  --cv-respiro-v: 10px;           /* respiro vertical mínimo do palco */
}
.canvas-bloco-wrap:not(#cvx) {
  padding-top: var(--cv-respiro-v) !important;
  padding-bottom: var(--cv-respiro-v) !important;
}
/* Largura idêntica em todo slide, centralizada — a "página de livro" */
.canvas-bloco-wrap:not(#cvx) .s-body {
  width: 100% !important;
  max-width: var(--cv-largura-palco) !important;
  margin-inline: auto !important;
}
.canvas-bloco-wrap:not(#cvx) .slide {
  width: 100% !important;
  max-width: var(--cv-largura-palco) !important;
  margin-inline: auto !important;
}

/* ── 76.1 · TRÊS LARGURAS DE LEITURA (botão P / M / G) ────────────────────── */
.canvas-bloco-wrap[data-cv-larg="p"] { --cv-largura-palco: 980px; }
.canvas-bloco-wrap[data-cv-larg="m"] { --cv-largura-palco: 1180px; }
.canvas-bloco-wrap[data-cv-larg="g"] { --cv-largura-palco: 1520px; }

/* ══════════════════════════════════════════════════════════════════════════
   CAMADA v77 — PÁGINA ÚNICA DE LIVRO (23/ago/2026)
   ──────────────────────────────────────────────────────────────────────────
   Sete correções medidas em bancada (Chrome headless, 2560x1080, 16 blocos
   reais, CSS + KaTeX reais). Nada foi removido do arquivo: esta camada fica
   no FIM de propósito — mesma especificidade decide por POSIÇÃO.

   77.1  largura útil única para TODOS os slides (fim da sanfona horizontal)
   77.2  escala tipográfica ancorada: alargar a página não infla a letra
   77.3  fórmula em UMA caixa só (fim do caixa-dentro-de-caixa)
   77.4  rótulos do T01 sem quebra de linha
   77.5  ícone com tinta forte (fim do ícone branco sobre pastel de 8%)
   77.6  grade interna de card não estica (fim do card alto, vazio e sobreposto)
   77.7  T08 — pirâmide e painel redistribuídos
   77.8  barra de controle da lousa: botões que não saem do lugar + animação
   ══════════════════════════════════════════════════════════════════════════ */

/* ── 77.1 · LARGURA ÚTIL ÚNICA ───────────────────────────────────────────────
   MEDIDO: com --cv-largura-palco em 1180px a lousa ocupava 1175px de 2560px
   (46% da tela). O conteúdo espremido é o que forçava quebra de linha em
   rótulo curto, coluna de texto de 206px e empilhamento vertical desnecessário.
   A faixa passa a 1620px — o mesmo número em TODO slide, como a mancha de
   texto de um livro: nunca uma página com 500 e a seguinte com 249.
   A subtração da margem é feita UMA vez, no .slide; o .s-body ocupa a faixa
   inteira (antes a subtração acontecia duas vezes e encolhia de novo).      */
.canvas-bloco-wrap {
  --cv-largura-palco: 1620px;
  --cv-margem-lateral: 20px;
}
.canvas-bloco-wrap[data-cv-larg="p"] { --cv-largura-palco: 1280px; }
.canvas-bloco-wrap[data-cv-larg="m"] { --cv-largura-palco: 1620px; }
.canvas-bloco-wrap[data-cv-larg="g"] { --cv-largura-palco: 1900px; }

.canvas-bloco-wrap:not(#cvx) .slide {
  width: 100% !important;
  max-width: min(var(--cv-largura-palco), calc(100% - 2 * var(--cv-margem-lateral))) !important;
  margin-inline: auto !important;
}
.canvas-bloco-wrap:not(#cvx) .s-body {
  width: 100% !important;
  max-width: 100% !important;
  margin-inline: 0 !important;
}
/* O mapa mental (T14) segue com pan/zoom livre e usa a tela toda por desenho.*/
.canvas-bloco-wrap[data-mapa="1"]:not(#cvx) .slide,
.canvas-bloco-wrap[data-tpl="T14"]:not(#cvx) .slide,
.canvas-bloco-wrap[data-mapa="1"]:not(#cvx) .s-body,
.canvas-bloco-wrap[data-tpl="T14"]:not(#cvx) .s-body {
  max-width: 100vw !important;
  width: 100vw !important;
  margin: 0 !important;
  padding: 0 !important;
  overflow: visible !important;
}

/* ── 77.2 · ESCALA TIPOGRÁFICA ANCORADA ──────────────────────────────────────
   DOIS DEFEITOS MEDIDOS, MESMA ORIGEM:

   (a) `.canvas-bloco-wrap p` e `.slide` usavam
       clamp(15px, 1.5vw + 10px, 24px) — `vw` é a JANELA, não o card. Em
       2560px isso trava no teto de 24px enquanto todo o resto do slide, que
       usa `cqi` (largura do .slide), fica em ~17px. Medido no bloco 1: o
       parágrafo "O estudo de matrizes..." em 24px dentro de uma coluna de
       206px = 384px de altura. Era esta a "fonte muito grande".

   (b) a base era 0.82cqi + 8px. Ao alargar a faixa de 1180 para 1620 (77.1)
       essa inclinação levaria a base de 17,7px para 21px — a letra cresceria
       junto com a página, que é exatamente o que NÃO se quer: o ganho de
       largura tem de virar espaço para o texto, não letra maior.

   CORREÇÃO: inclinação suave (0.35cqi) com intercepto alto (12px). Resultado
   medido: 17,7px de base em faixa de 1620px — o MESMO corpo de antes — e
   variação de apenas 2,2px entre a faixa mínima e a máxima, contra 6px antes.
   Homogeneidade entre blocos é consequência aritmética, não sorte.

   PISO POR DEGRAU: os degraus pequenos deixam de ser proporção pura e passam
   a ter chão em px. Era daí a "fonte minúscula" dos blocos 6, 7, 8, 12, 13 e
   15 (medido 11,5px). Nada mais desce de 13px.                              */
.canvas-bloco-wrap .slide:not(#cvx) {
  --cv-fs-base: clamp(15.5px, 0.35cqi + 12px, 19px);
}
.canvas-bloco-wrap:not(#cvx) .s-body[style*="--cvx-zoom-txt"] {
  --cv-fs-base: clamp(15.5px, calc((0.35cqi + 12px) * min(var(--cvx-zoom-txt, 1), 1.12)), 21px);
}
.canvas-bloco-wrap:not(#cvx) {
  --cv-fs-micro:    max(12.5px, calc(var(--cv-fs-base, 16px) * 0.78));
  --cv-fs-caption:  max(13px,   calc(var(--cv-fs-base, 16px) * 0.85));
  --cv-fs-small:    max(13.5px, calc(var(--cv-fs-base, 16px) * 0.92));
  --cv-fs-body:     var(--cv-fs-base, 16px);
  --cv-fs-subtitle: calc(var(--cv-fs-base, 16px) * 1.12);
  --cv-fs-title:    calc(var(--cv-fs-base, 16px) * 1.28);
  --cv-fs-display:  calc(var(--cv-fs-base, 16px) * 1.62);
  --cv-fs-hero:     calc(var(--cv-fs-base, 16px) * 2.00);

  /* CHAVE DE ABÓBADA: --cv-fs-raw é o fallback de ~20 regras do arquivo, e o
     default delas era o clamp de `vw` descrito acima. Redeclarando a variável
     aqui, TODAS passam a ler a escala do container de uma vez — sem editar
     nenhuma delas. O editor visual continua mandando: ele escreve
     --cv-fs-raw INLINE no elemento, e inline vence regra.                   */
  --cv-fs-raw: var(--cv-fs-body);
}
/* O .slide herda a mesma decisão (a regra de origem ficava na linha ~3822). */
.canvas-bloco-wrap:not(#cvx) .slide { font-size: var(--cv-fs-raw, var(--cv-fs-body)); }

/* ── 77.2b · CORPO DE TEXTO HOMOGÊNEO ENTRE CARDS ────────────────────────────
   No bloco 2 o card "Regra de Notação Padrão" usava .fs-body e os três avisos
   ao lado usavam .fs-small — dois corpos de leitura diferentes lado a lado no
   mesmo slide. Texto de LEITURA tem um tamanho só; `small`/`caption` ficam
   para legenda, rodapé de card e rótulo de eixo, que é o papel deles.       */
.canvas-bloco-wrap:not(#cvx) .crime-alert p,
.canvas-bloco-wrap:not(#cvx) .a-card-desc,
.canvas-bloco-wrap:not(#cvx) .cid-desc,
.canvas-bloco-wrap:not(#cvx) .vs-item-txt,
.canvas-bloco-wrap:not(#cvx) .tl-desc,
.canvas-bloco-wrap:not(#cvx) .crime-card-body > .crime-row .fs-small,
.canvas-bloco-wrap:not(#cvx) .card > p,
.canvas-bloco-wrap:not(#cvx) .card > .fs-small,
.canvas-bloco-wrap:not(#cvx) .crime-row > span.fs-small {
  font-size: var(--cv-ac-desc-fs, var(--cv-fs-body)) !important;
  line-height: var(--cvx-alert-lh, 1.55) !important;
}
/* Título interno de card: um degrau só, em todo template. */
.canvas-bloco-wrap:not(#cvx) .crime-alert-hdr,
.canvas-bloco-wrap:not(#cvx) .a-card-label,
.canvas-bloco-wrap:not(#cvx) .rotulo,
.canvas-bloco-wrap:not(#cvx) .micro-label,
.canvas-bloco-wrap:not(#cvx) .eq-math-lbl {
  font-size: var(--cv-fs-caption) !important;
}

/* ── 77.3 · FÓRMULA EM UMA CAIXA SÓ ──────────────────────────────────────────
   CAUSA EXATA (medida, não deduzida): a linha ~3084 deste arquivo tem uma
   regra GLOBAL, sem escopo de canvas, dando ao `.katex-display` fundo,
   `border:1.5px dashed`, `border-radius:12px`, `box-shadow` e `padding:16px
   12px`. Só que o `.mono-box` que o envolve JÁ é uma caixa (fundo, borda,
   padding e min-height de 3,2 linhas). Resultado medido no bloco 1:
   .mono-box de 103px de altura contendo um .katex-display de 56px que nem
   preenchia a largura (158px de 315px) — a "caixa dentro de caixa".

   DECISÃO: a caixa é UMA — a de fora vira contêiner puro (sem tinta, sem
   respiro, sem altura mínima) e quem desenha a moldura pontilhada é o
   .katex-display, agora ocupando a largura inteira e com respiro enxuto.
   Ganho medido: -48px de altura por fórmula. Vale para TODOS os templates.  */
.canvas-bloco-wrap:not(#cvx) .mono-box,
.canvas-bloco-wrap:not(#cvx) .exec-mono-box,
.canvas-bloco-wrap:not(#cvx) .eq-math-card,
.canvas-bloco-wrap:not(#cvx) .fml-main,
.canvas-bloco-wrap:not(#cvx) .eq-f-formula {
  display: block !important;
  width: 100% !important;
  background: transparent !important;
  background-image: none !important;
  border: 0 !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  padding: 0 !important;
  min-height: 0 !important;
  overflow-x: auto !important;
  overflow-y: hidden !important;
}
/* A ÚNICA caixa da fórmula. */
.canvas-bloco-wrap:not(#cvx) .katex-display {
  display: block !important;
  width: 100% !important;
  max-width: 100% !important;
  box-sizing: border-box !important;
  margin: 0 !important;
  padding: var(--cvx-fml-pad-y, 9px) var(--cvx-fml-pad-x, 16px) !important;
  background: var(--cvx-fml-bg, var(--bg-subtle)) !important;
  border: 1px dashed var(--cvx-fml-borda, #C7D7F5) !important;
  border-radius: var(--cv-radius-card, var(--radius-md)) !important;
  box-shadow: none !important;
  text-align: center !important;
  overflow-x: auto !important;
  overflow-y: hidden !important;
}
/* Fórmula solta no meio da prosa NUNCA vira caixa: é texto corrido. */
.canvas-bloco-wrap:not(#cvx) p .katex-display,
.canvas-bloco-wrap:not(#cvx) span[data-tex] .katex-display,
.canvas-bloco-wrap:not(#cvx) .cid-desc .katex-display,
.canvas-bloco-wrap:not(#cvx) .vs-item-txt .katex-display,
.canvas-bloco-wrap:not(#cvx) .a-card-desc .katex-display,
.canvas-bloco-wrap:not(#cvx) td .katex-display,
.canvas-bloco-wrap:not(#cvx) .pill .katex-display {
  background: transparent !important;
  border: 0 !important;
  padding: 0 !important;
  border-radius: 0 !important;
}
/* Duas fórmulas seguidas dentro do mesmo card ganham respiro entre si. */
.canvas-bloco-wrap:not(#cvx) .mono-box + .mono-box { margin-top: 8px !important; }

/* ── 77.4 · RÓTULOS DO T01 SEM QUEBRA ────────────────────────────────────────
   MEDIDO: `.eq-param` tinha max-width:280px mas recebia só 163px reais, e o
   valor (`.v`) usava --cv-fs-title (1,28x) em fonte monoespaçada — a
   combinação partia "Disposição Horizontal (i = 1...m)" em TRÊS linhas. Com
   a faixa de 77.1 sobra largura; o teto artificial sai e o valor volta ao
   corpo de leitura.                                                          */
.canvas-bloco-wrap:not(#cvx) .eq-param {
  max-width: none !important;
  gap: 14px !important;
  align-items: center !important;
}
.canvas-bloco-wrap:not(#cvx) .eq-st-params {
  align-items: stretch !important;
  gap: 14px !important;
}
.canvas-bloco-wrap:not(#cvx) .eq-param-info { min-width: 0 !important; }
.canvas-bloco-wrap:not(#cvx) .eq-param-info .v {
  font-family: inherit !important;
  font-size: var(--cv-fs-small) !important;
  font-weight: 700 !important;
  line-height: 1.35 !important;
  display: block !important;
}
.canvas-bloco-wrap:not(#cvx) .eq-param-info .k { font-size: var(--cv-fs-caption) !important; }

/* ── 77.5 · ÍCONE COM TINTA FORTE ────────────────────────────────────────────
   O gerador escreve `style='background:var(--blue-100)'` no selo do ícone
   (pastel de 8%) e a camada 70.4 pinta o `<i>` de BRANCO. Branco sobre pastel
   é 1,3:1 — o ícone some, que é a queixa "ícones muito claros". O fundo do
   selo passa para a tinta da família; o glifo branco volta a ter 4,5:1.
   Casa pelo texto do atributo style, então corrige TAMBÉM as lousas já
   salvas, sem depender de o gerador mudar.                                   */
.canvas-bloco-wrap:not(#cvx) .cid-icon-wrap,
.canvas-bloco-wrap:not(#cvx) .exec-cid-icon,
.canvas-bloco-wrap:not(#cvx) .eq-param-icon,
.canvas-bloco-wrap:not(#cvx) .crime-card-hdr-icon {
  background: var(--blue-ink) !important;
  color: #fff !important;
  box-shadow: none !important;
  border: 0 !important;
}
.canvas-bloco-wrap:not(#cvx) .cid-icon-wrap i,
.canvas-bloco-wrap:not(#cvx) .exec-cid-icon i,
.canvas-bloco-wrap:not(#cvx) .eq-param-icon i,
.canvas-bloco-wrap:not(#cvx) .crime-card-hdr-icon i {
  color: #fff !important;
  font-size: calc(var(--cv-fs-base, 16px) * 1.05) !important;
}
.canvas-bloco-wrap:not(#cvx) [class*="icon-wrap"][style*="--green-100"],
.canvas-bloco-wrap:not(#cvx) [class*="icon-wrap"][style*="--green-600"],
.canvas-bloco-wrap:not(#cvx) .cid-icon-wrap.green,
.canvas-bloco-wrap:not(#cvx) .eq-param-icon.green { background: var(--green-ink) !important; }
.canvas-bloco-wrap:not(#cvx) [class*="icon-wrap"][style*="--amber-100"],
.canvas-bloco-wrap:not(#cvx) [class*="icon-wrap"][style*="--amber-600"],
.canvas-bloco-wrap:not(#cvx) .cid-icon-wrap.amber,
.canvas-bloco-wrap:not(#cvx) .eq-param-icon.amber { background: var(--amber-ink) !important; }
.canvas-bloco-wrap:not(#cvx) [class*="icon-wrap"][style*="--red-100"],
.canvas-bloco-wrap:not(#cvx) [class*="icon-wrap"][style*="--red-600"],
.canvas-bloco-wrap:not(#cvx) .cid-icon-wrap.red,
.canvas-bloco-wrap:not(#cvx) .eq-param-icon.red { background: var(--red-ink) !important; }
.canvas-bloco-wrap:not(#cvx) [class*="icon-wrap"][style*="--roxo-100"],
.canvas-bloco-wrap:not(#cvx) [class*="icon-wrap"][style*="--roxo-ink"],
.canvas-bloco-wrap:not(#cvx) .cid-icon-wrap.roxo { background: var(--roxo-ink) !important; }
.canvas-bloco-wrap:not(#cvx) [class*="icon-wrap"][style*="--ciano-100"],
.canvas-bloco-wrap:not(#cvx) [class*="icon-wrap"][style*="--ciano-ink"],
.canvas-bloco-wrap:not(#cvx) .cid-icon-wrap.ciano { background: var(--ciano-ink) !important; }

/* ── 77.6 · GRADE INTERNA DE CARD NÃO ESTICA ─────────────────────────────────
   Dentro de um card esticado por flex, uma grade com `align-items:stretch`
   (padrão) faz a célula MAIS BAIXA crescer até a altura da mais alta: nasce a
   caixa colorida alta e vazia (bloco 9, "Diagonal Principal") e o conteúdo
   seguinte é empurrado por cima do card. As células voltam a ter a altura do
   próprio conteúdo, ancoradas no topo.                                       */
.canvas-bloco-wrap:not(#cvx) .card > div[style*="grid-template-columns"],
.canvas-bloco-wrap:not(#cvx) .eq-step-card > div[style*="grid-template-columns"],
.canvas-bloco-wrap:not(#cvx) .crime-card > div[style*="grid-template-columns"],
.canvas-bloco-wrap:not(#cvx) .a-card > div[style*="grid-template-columns"] {
  align-items: start !important;
  align-content: start !important;
}
/* Nenhum filho de card pode sair da caixa nem cobrir o irmão de cima. */
.canvas-bloco-wrap:not(#cvx) .eq-step-card,
.canvas-bloco-wrap:not(#cvx) .cid-card,
.canvas-bloco-wrap:not(#cvx) .crime-card,
.canvas-bloco-wrap:not(#cvx) .a-card,
.canvas-bloco-wrap:not(#cvx) .card {
  overflow: visible !important;
  min-height: 0 !important;
}
.canvas-bloco-wrap:not(#cvx) .eq-step-card > *,
.canvas-bloco-wrap:not(#cvx) .card > * { min-width: 0 !important; }
/* Faixa de conclusão (status-banner) é o último elemento e nunca invade. */
.canvas-bloco-wrap:not(#cvx) .status-banner {
  margin-top: 10px !important;
  position: static !important;
  align-items: flex-start !important;
}

/* ── 77.7 · T08 — PIRÂMIDE E PAINEL REDISTRIBUÍDOS ───────────────────────────
   A pirâmide tem 3 a 6 degraus de altura fixa dentro de uma coluna de 1fr com
   `align-items:center`: sobrava metade da coluna em branco enquanto o painel
   ao lado espremia tabela e aviso. A coluna do desenho passa a ser a menor,
   ancorada no topo e com altura do próprio conteúdo; o painel fica com o
   espaço que realmente usa.                                                  */
.canvas-bloco-wrap:not(#cvx) .kelsen-grid {
  grid-template-columns: minmax(220px, 0.8fr) minmax(0, 2fr) !important;
  align-items: start !important;
  gap: var(--cv-gap) !important;
}
.canvas-bloco-wrap:not(#cvx) .kelsen-grid > .pyramid {
  height: auto !important;
  align-self: stretch !important;
  justify-content: center !important;
}
.canvas-bloco-wrap:not(#cvx) .pyr-lvl {
  padding: 11px var(--cv-pyr-pad-x, 14px) !important;
  font-size: var(--cv-fs-small) !important;
  box-shadow: none !important;
}
/* Aviso de rodapé do T08 (e de qualquer painel): largura total da lâmina. */
.canvas-bloco-wrap:not(#cvx) .s-body > .a-card { width: 100% !important; }

/* ══════════════════════════════════════════════════════════════════════════
   77.8 — BARRA DE CONTROLE DA LOUSA: BOTÃO QUE NÃO SAI DO LUGAR
   ──────────────────────────────────────────────────────────────────────────
   A coluna direita do cabeçalho é `justify-content:flex-end`: TUDO que muda
   de largura ali empurra os botões. Três fontes de movimento, todas medidas:
     1. #cvlive-estado alterna AULA / NARRANDO / PAUSADA / DÚVIDA — 4 larguras;
     2. #canvas-paginacao nasce display:none e vira flex;
     3. #canvas-btn-proxima-rodape aparece e some conforme haja próximo bloco.
   Cada um ganha largura reservada. O texto muda, a caixa não.
   ══════════════════════════════════════════════════════════════════════════ */
#cvlive-estado {
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  box-sizing: border-box !important;
  min-width: 88px !important;
  height: 20px !important;
  transition: background .22s ease, color .22s ease !important;
}
#canvas-nav-grupo {
  display: flex;
  align-items: center;
  gap: 2px;
  min-width: 232px;
  justify-content: flex-end;
}
#canvas-paginacao { min-width: 148px; justify-content: flex-end; }
#canvas-pagina-txt { min-width: 92px !important; }
#canvas-btn-proxima-rodape { min-width: 150px; justify-content: center; }
#cvlive-console { display: flex; align-items: center; gap: 2px; }
#cvlive-console .canvas-flat-btn { width: 32px; min-width: 32px; padding: 0 !important; }

/* Animação de estado — mesmo vocabulário visual do menu superior:
   o ícone reage, o botão não muda de tamanho.                               */
.canvas-flat-btn { transition: background .2s ease, color .2s ease, transform .12s ease; }
.canvas-flat-btn:active { transform: scale(.92); }
.canvas-flat-btn svg { transition: transform .2s ease, opacity .2s ease; }
.canvas-flat-btn:hover svg { transform: scale(1.08); }

@keyframes cv-pulso-vivo {
  0%, 100% { opacity: 1;   transform: scale(1); }
  50%      { opacity: .55; transform: scale(.88); }
}
@keyframes cv-onda-live {
  0%   { box-shadow: 0 0 0 0 rgba(37, 99, 235, .35); }
  70%  { box-shadow: 0 0 0 7px rgba(37, 99, 235, 0); }
  100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
}
@keyframes cv-giro-uma-volta { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

.canvas-flat-btn.cv-ativo { background: var(--accent-light); color: var(--accent); }
#cvlive-btn-mic.cv-ativo  svg { animation: cv-pulso-vivo 1.5s ease-in-out infinite; }
#cvlive-btn-live.cv-ativo     { animation: cv-onda-live 2s ease-out infinite; }
#cvlive-btn-conversar.cv-ativo svg { animation: cv-pulso-vivo 1.9s ease-in-out infinite; }
.canvas-flat-btn.cv-girando svg { animation: cv-giro-uma-volta .5s ease-in-out 1; }
@media (prefers-reduced-motion: reduce) {
  #cvlive-btn-mic.cv-ativo svg,
  #cvlive-btn-live.cv-ativo,
  #cvlive-btn-conversar.cv-ativo svg,
  .canvas-flat-btn.cv-girando svg { animation: none !important; }}

/* ── 77.9 · AFINAÇÃO FINAL MEDIDA (2ª passada da bancada) ────────────────────
   Três números que só apareceram depois de a faixa alargar:
   1. `.eq-st-params` recebia 1/2,6 da coluna e o rótulo ainda partia em duas
      linhas — o peso passa a 1,4 e o selo do ícone cai de 46 para 40px, o que
      devolve ~90px ao texto. Medido: 2 quebras -> 0.
   2. respiro de card e vão entre cards: os tetos de 24px/26px foram calibrados
      para uma faixa de 1180px. Numa faixa de 1620 eles viram desperdício
      vertical — 20px/22px devolvem altura sem apertar nada.
   3. o aviso (.crime-alert) ganhou corpo de leitura em 77.2b; o respiro
      vertical dele encolhe na mesma medida para o saldo do bloco ficar igual. */
.canvas-bloco-wrap:not(#cvx) {
  --cv-gap:      clamp(12px, 0.95cqi + 5px, 22px);
  --cv-pad-card: clamp(13px, 0.75cqi + 6px, 20px);
}
.canvas-bloco-wrap:not(#cvx) .eq-st-params {
  flex: 1.6 !important;
  padding: 14px 14px !important;
}
.canvas-bloco-wrap:not(#cvx) .eq-param-icon {
  width: 40px !important;
  height: 40px !important;
}
.canvas-bloco-wrap:not(#cvx) .eq-param { gap: 12px !important; }
.canvas-bloco-wrap:not(#cvx) .crime-alert {
  padding: 12px 16px !important;
  justify-content: center !important;
}
/* Mantém a regra V52: cada alerta divide igualmente a altura sobrando da
   coluna (flex:1 1 0), preenchendo-a de ponta a ponta sem vão vazio entre
   os cards. A versão anterior (flex:0 1 auto) reabria exatamente o buraco
   que V52 já havia corrigido — revertida aqui para não brigar com V52. */
.canvas-bloco-wrap:not(#cvx) .crime-alert-stack > .crime-alert {
  flex: 1 1 0 !important;
  display: flex !important;
  flex-direction: column !important;
  justify-content: center !important;
}
.canvas-bloco-wrap:not(#cvx) .crime-alert-stack {
  justify-content: flex-start !important;
  gap: var(--cv-gap) !important;
}

/* ── 77.10 · GRADE NÃO ESTICA ATÉ O RODAPÉ (fim das molduras vazias) ─────────
   MEDIDO no T08: a .kelsen-grid tem `flex:1` e os filhos têm
   `min-height:100%` + `align-self:stretch` — a moldura da pirâmide e o painel
   ao lado esticavam até 1043px enquanto o conteúdo pedia ~520px, abrindo dois
   retângulos brancos gigantes embaixo. `align-content:start` mantém as colunas
   IGUAIS entre si (sem dente) e ao mesmo tempo dá à linha do grid a altura do
   próprio conteúdo. O que sobra vira respiro do palco, não caixa vazia.      */
.canvas-bloco-wrap:not(#cvx) .kelsen-grid,
.canvas-bloco-wrap:not(#cvx) .cid-grid,
.canvas-bloco-wrap:not(#cvx) .crime-grid,
.canvas-bloco-wrap:not(#cvx) .vs-grid,
.canvas-bloco-wrap:not(#cvx) .kpi-grid,
.canvas-bloco-wrap:not(#cvx) .eq-z1,
.canvas-bloco-wrap:not(#cvx) .eq-z2,
.canvas-bloco-wrap:not(#cvx) .venn-grid,
.canvas-bloco-wrap:not(#cvx) .s-body > [style*="grid-template-columns"] {
  align-content: start !important;
  flex: 0 1 auto !important;
}
/* A moldura da pirâmide acompanha a coluna irmã, mas nunca o palco inteiro. */
.canvas-bloco-wrap:not(#cvx) .kelsen-grid > .pyramid {
  align-self: stretch !important;
  height: auto !important;
  min-height: 0 !important;
}

/* ── 77.11 · SVG DENTRO DE MOLDURA DE ALTURA FIXA ────────────────────────────
   REGRESSÃO CAÇADA NA BANCADA: o gerador escreve molduras com altura cravada
   (`style='width:100%;height:100px;display:flex;...'`) e um <svg width='100%'
   height='100%'> dentro. A camada v74.5 força `height:auto` no SVG — o que é
   certo quando o pai NÃO tem altura própria, mas com a faixa mais larga (77.1)
   a altura automática do desenho dobrou e passou por cima do rótulo do card.
   Quando o pai declara altura, o desenho volta a obedecê-la; o
   preserveAspectRatio cuida do resto. Sem `height:` inline no pai, nada muda. */
.canvas-bloco-wrap:not(#cvx) [style*=";height:"] > svg[height="100%"],
.canvas-bloco-wrap:not(#cvx) [style^="height:"] > svg[height="100%"],
.canvas-bloco-wrap:not(#cvx) [style*="; height:"] > svg[height="100%"] {
  height: 100% !important;
  max-height: 100% !important;
}

/* ── 77.12 · T01 — A DUPLA "TEXTO + PARÂMETROS" EMPILHA EM VEZ DE ESPREMER ───
   MEDIDO em 1440x900: a coluna dos parâmetros recebe 274px, dos quais 195
   sobram para o texto — e "Disposição Horizontal (i = 1...m)" precisa de 218.
   Faltavam 23px e o rótulo partia em duas linhas. Em vez de encolher a letra
   (o que quebraria a homogeneidade da escala), a caixa passa a ter um piso de
   largura por coluna: enquanto os dois lados couberem com 300px cada, ficam
   lado a lado como hoje; abaixo disso, empilham e cada um usa a faixa inteira.
   Em ultrawide nada muda — a coluna tem ~360px de cada lado.               */
.canvas-bloco-wrap:not(#cvx) .eq-sintese-box { flex-wrap: wrap !important; }
.canvas-bloco-wrap:not(#cvx) .eq-sintese-box > .eq-st-text,
.canvas-bloco-wrap:not(#cvx) .eq-sintese-box > .eq-st-params { min-width: 300px !important; }
.canvas-bloco-wrap:not(#cvx) .eq-sintese-box > .eq-st-params:not(:first-child) {
  border-left: 0 !important;
}

/* ══════════════════════════════════════════════════════════════════════════
   CAMADA V78 — RODADA 2 DE CORREÇÕES (23/ago/2026)
   ──────────────────────────────────────────────────────────────────────────
   Fica no FIM do arquivo de propósito: cascata decide por posição em caso de
   empate de especificidade, e esta camada precisa vencer tudo que veio antes.
   Cobre 3 bugs desta rodada:
     78.1  .cid-card (T04) — ícone menor + espaçamento vertical reduzido,
           conteúdo sobe (menos ar acima do título).
     78.2  Reforço genérico anti-"buraco vazio": qualquer grid/flex inline
           DENTRO de qualquer card (não só filho direto) para de esticar
           verticalmente além do próprio conteúdo. Cobre variações de
           template que a regra 77.6 (só filho direto) não alcançava.
     78.3  Mapa mental (T14) — .mm-left/.mm-right não tinham NENHUMA regra de
           empilhamento vertical (nem display:flex, nem gap) quando um lado
           tem mais de um .mm-branch-wrap: os grupos apenas se empilhavam em
           block-flow puro, sem gap consistente — a causa raiz do efeito
           "dente" (grupos de ramo com espaçamento aleatório/desigual entre
           si). Vira flex-column com gap fixo e centralizado no eixo do nó
           raiz.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── 78.1 · CID-CARD (T04) MAIS COMPACTO — ícone menor, conteúdo sobe ──────
   ANTES: ícone circular de 46px + padding-top de 24px + margin-bottom de
   12px no ícone = ~82px de ar antes do título aparecer (ver .cid-icon-wrap
   em ~L9885 e .cid-card em ~L9039). Card fica alto e o texto começa muito
   abaixo do topo. Reduzido para caber mais conteúdo com menos altura, sem
   mudar a largura/grid (isso é só vertical).                               */
.canvas-bloco-wrap:not(#cvx) .cid-card {
  padding: 16px 18px !important;
  gap: 6px !important;
}
.canvas-bloco-wrap:not(#cvx) .cid-icon-wrap {
  width: 30px !important;
  height: 30px !important;
  margin-bottom: 4px !important;
}
.canvas-bloco-wrap:not(#cvx) .cid-icon-wrap i {
  font-size: 14px !important;
}
.canvas-bloco-wrap:not(#cvx) .cid-title {
  margin-bottom: 4px !important;
}
.canvas-bloco-wrap:not(#cvx) .cid-desc {
  margin-bottom: 8px !important;
}

/* ── 78.2 · ANTI-"BURACO VAZIO" GENÉRICO (reforça 77.6 para grids/flex
   ANINHADOS, não só filho direto de .card) ─────────────────────────────────
   77.6 só pegava `.card > div[style*="grid-template-columns"]` (filho
   DIRETO). Vários templates (painel de mnemônicos, grade de "Passo N")
   colocam o grid/flex inline um nível mais fundo (dentro de um wrapper sem
   classe reconhecida) — a regra antiga não alcançava e a caixa continuava
   esticando para preencher a altura sobrando do card pai. Agora cobre
   QUALQUER profundidade dentro de .card/.a-card/.crime-card/.eq-step-card. */
.canvas-bloco-wrap:not(#cvx) .card [style*="grid-template-columns"],
.canvas-bloco-wrap:not(#cvx) .a-card [style*="grid-template-columns"],
.canvas-bloco-wrap:not(#cvx) .crime-card [style*="grid-template-columns"],
.canvas-bloco-wrap:not(#cvx) .eq-step-card [style*="grid-template-columns"] {
  align-items: start !important;
  align-content: start !important;
}
.canvas-bloco-wrap:not(#cvx) .card [style*="grid-template-columns"] > *,
.canvas-bloco-wrap:not(#cvx) .a-card [style*="grid-template-columns"] > *,
.canvas-bloco-wrap:not(#cvx) .crime-card [style*="grid-template-columns"] > *,
.canvas-bloco-wrap:not(#cvx) .eq-step-card [style*="grid-template-columns"] > * {
  height: auto !important;
  align-self: start !important;
}
/* Mesma lógica para wrappers flex-column inline (não-grid) dentro de card:
   um filho com flex:1 herdado não deve esticar até a altura do irmão mais
   alto do card — cada bloco de texto/linha usa só a altura do que escreve. */
.canvas-bloco-wrap:not(#cvx) .card > div[style*="display:flex"],
.canvas-bloco-wrap:not(#cvx) .card > div[style*="display: flex"],
.canvas-bloco-wrap:not(#cvx) .a-card > div[style*="display:flex"],
.canvas-bloco-wrap:not(#cvx) .a-card > div[style*="display: flex"] {
  align-self: flex-start !important;
}

/* ── 78.3 · MAPA MENTAL — FIM DO "DENTE" ENTRE GRUPOS DE RAMO ──────────────
   .mm-left/.mm-right não tinham display:flex nem gap definidos: quando um
   lado tem 2+ .mm-branch-wrap (ex.: "CONCEITO E ESTRUTURA" e "QUADRADAS E
   SIMETRIAS" ambos à esquerda), eles só se empilhavam em fluxo de bloco
   comum, sem espaçamento consistente entre si — o efeito serrilhado
   ("dente") reclamado. Agora cada lado é uma coluna flex com gap fixo,
   centralizada no eixo vertical do nó raiz — mesmo espaço entre qualquer
   par de grupos de ramo, dos dois lados, sempre.                           */
.canvas-bloco-wrap:not(#cvx) .mm-left,
.canvas-bloco-wrap:not(#cvx) .mm-right {
  display: flex !important;
  flex-direction: column !important;
  justify-content: center !important;
  gap: var(--cv-mm-branch-gap, 32px) !important;
}

/* ══════════════════════════════════════════════════════════════════════════
   CAMADA V79 — RODADA 3 (23/ago/2026)
   ──────────────────────────────────────────────────────────────────────────
   Fica no FIM do arquivo de proposito: em empate de especificidade a cascata
   decide por POSICAO, e esta camada precisa vencer o que veio antes.
   DUAS regras, as duas medidas em Chrome sobre a lousa real de Matrizes
   (16 blocos, 2560x1080 e 1440x900). Nao ha aqui nenhuma regra "por via das
   duvidas": o que nao foi medido nao entrou.
     79.1  #cv-selo com largura reservada (rede de seguranca do patch do JS).
     79.2  card que pediu centralizacao INLINE volta a centralizar.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── 79.1 · SELO DE ESTADO DA BARRA — LARGURA RESERVADA ──────────────────────
   O #cv-selo e criado pelo bloco "BARRA DO CANVAS v72" e estilizado por um
   <style id="cv-barra-css"> injetado em runtime — que, por ser inserido no
   <head> DEPOIS deste arquivo, vence em empate de especificidade. O patch
   principal esta no proprio Mobile.html; esta regra e a rede de seguranca
   para o caso de o bloco injetado voltar a uma versao antiga: com !important
   ela vence de qualquer forma. Mesmos numeros dos dois lados — sem conflito.
   MEDIDO: AULA / PAUSADA / CONVERSA tem larguras diferentes; sem caixa fixa,
   cada troca de estado empurrava todos os botoes a direita do selo.         */
#cv-selo {
  display: inline-flex !important;
  align-items: center !important;
